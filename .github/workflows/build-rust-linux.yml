name: Build Rust kernels (Linux x86_64)

# Builds the Linux x86_64 .so for `hbt_rust_kernels` and commits it back
# under `tools/rf/ssm/rust_kernels/bin/linux_x86_64/` so Streamlit Cloud
# (which runs Linux but has no Rust toolchain) can use the accelerated
# CPU kernels.
#
# Triggers:
#   • push to IOED-Tools / main when any Rust source / build config changes
#   • manual run via the Actions tab (workflow_dispatch)
#
# Self-skip: when this workflow commits the rebuilt binary, the commit
# message ends with "[skip ci]" so it doesn't re-trigger itself.

on:
  push:
    branches: [IOED-Tools, main]
    paths:
      - "tools/rf/ssm/rust_kernels/src/**"
      - "tools/rf/ssm/rust_kernels/Cargo.toml"
      - "tools/rf/ssm/rust_kernels/Cargo.lock"
      - "tools/rf/ssm/rust_kernels/pyproject.toml"
      - "dev/build_rust_kernels.py"
      - ".github/workflows/build-rust-linux.yml"
  workflow_dispatch:

permissions:
  contents: write   # required for `git push` from inside the workflow

concurrency:
  group: build-rust-linux-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node 24 now so the deprecation warnings on actions/* go away
# (the underlying actions are unchanged — only the runtime is bumped).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.9
        # Build-time interpreter only.  The wheel is abi3-py39, so the
        # resulting .so works on every Python ≥3.9 at runtime —
        # including Streamlit Cloud's 3.14.
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/rf/ssm/rust_kernels/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/rf/ssm/rust_kernels/Cargo.toml', 'tools/rf/ssm/rust_kernels/src/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install maturin + numpy
        # maturin builds the wheel; numpy is needed for the smoke test below.
        run: python -m pip install --upgrade pip "maturin>=1.5,<2.0" numpy

      - name: Purge any cached wheels before building
        # The cache restore brings back the previous run's `target/`
        # directory, which may still contain a wheel from an earlier
        # build (different platform tag → different filename, e.g.
        # `linux_x86_64.whl` vs `manylinux_2_17_x86_64.whl`).  If we
        # don't delete the stale wheel here, the extract step's
        # `ls ... | head -n1` (alphabetical sort) picks the OLDER name
        # first, then commits a binary that doesn't have whichever
        # kernels were added since the cached run.  That's how the
        # `parse_and_compute_batch` regression slipped through.
        run: |
          rm -rf tools/rf/ssm/rust_kernels/target/wheels

      - name: Build wheel (release, abi3-py39)
        working-directory: tools/rf/ssm/rust_kernels
        run: maturin build --release --out target/wheels

      - name: Extract .so into bin/linux_x86_64/
        # Pull the compiled extension out of the wheel and drop it into
        # the committed-binary directory.  Mirrors what
        # `dev/build_rust_kernels.py::_extract_binary` does locally.
        #
        # `ls -t` (most-recent-first) is belt-and-braces in case the
        # purge step above ever fails to fire — picking by mtime
        # guarantees we always grab the wheel maturin just produced.
        run: |
          set -euo pipefail
          WHEEL=$(ls -t tools/rf/ssm/rust_kernels/target/wheels/hbt_rust_kernels-*.whl | head -n1)
          echo "Wheel: $WHEEL"
          mkdir -p tools/rf/ssm/rust_kernels/bin/linux_x86_64
          # Remove any stale binaries first so we don't leave abi3-py38
          # lying around once we've upgraded.
          rm -f tools/rf/ssm/rust_kernels/bin/linux_x86_64/hbt_rust_kernels*.so
          python - "$WHEEL" <<'PY'
          import sys, zipfile, shutil, os
          from pathlib import Path
          wheel = Path(sys.argv[1])
          dest  = Path("tools/rf/ssm/rust_kernels/bin/linux_x86_64")
          with zipfile.ZipFile(wheel) as z:
              members = [m for m in z.namelist()
                         if Path(m).name.startswith("hbt_rust_kernels")
                         and m.endswith(".so")]
              if not members:
                  raise SystemExit(f"No .so found in {wheel}")
              members.sort(key=lambda m: (len(m), m))
              src = members[0]
              out = dest / Path(src).name
              with z.open(src) as f, out.open("wb") as g:
                  shutil.copyfileobj(f, g)
              print(f"Extracted {src}  ->  {out}")
          PY
          ls -la tools/rf/ssm/rust_kernels/bin/linux_x86_64/

      - name: Smoke test the built binary
        # Import the .so and exercise every public kernel exported by the
        # binary.  Failing this step blocks the commit so a broken build
        # never gets pushed to the bin/ folder.
        #
        # Coverage:
        #   • y_to_s_4d — Phase 1 primitive, proves the abi3 import works
        #   • parse_and_compute_batch — Phase 1.5 bulk-upload accelerator
        #     (tests that the new kernel is in the binary and returns the
        #     SoA dict with all 11 expected keys, matching what the Python
        #     wrapper's `_expand_soa_to_per_file` will consume)
        run: |
          python - <<'PY'
          import sys, glob, numpy as np
          bins = sorted(glob.glob("tools/rf/ssm/rust_kernels/bin/linux_x86_64/hbt_rust_kernels*.so"))
          assert bins, "no .so found"
          sys.path.insert(0, "tools/rf/ssm/rust_kernels/bin/linux_x86_64")
          import hbt_rust_kernels as rk

          # ── y_to_s_4d ───────────────────────────────────────────────
          Y = (np.random.randn(4, 8, 2, 2) + 1j*np.random.randn(4, 8, 2, 2)).astype(np.complex128) * 0.01
          S = rk.y_to_s_4d(Y, 50.0)
          assert S.shape == Y.shape and S.dtype == np.complex128
          print("y_to_s_4d OK — output shape:", S.shape)

          # ── parse_and_compute_batch ─────────────────────────────────
          # Use a minimal valid Touchstone payload so we don't depend on
          # the repo's sample .s2p files being present in the workspace.
          s2p = b"""! smoke test
          # Hz S MA R 50
          1.0e9   0.7 -10   3.0 170   0.05 80   0.6 -8
          2.0e9   0.6 -20   2.5 160   0.07 70   0.5 -16
          3.0e9   0.5 -30   2.0 150   0.10 60   0.4 -24
          4.0e9   0.4 -40   1.6 140   0.13 50   0.3 -32
          5.0e9   0.3 -50   1.3 130   0.15 40   0.2 -40
          """
          soa = rk.parse_and_compute_batch([s2p, s2p, s2p], 2, 0.01, 50.0)
          expected_keys = {"n_per_file", "z0_per_file", "freq", "S",
                           "h21_db", "u_db", "mag_db", "k",
                           "ft_plat", "fmax_u_plat", "fmax_mag_plat",
                           "ft_cross", "ft_plateau", "ft_method",
                           "fmax_u_cross", "fmax_u_plateau", "fmax_u_method",
                           "fmax_mag_cross", "fmax_mag_plateau", "fmax_mag_method",
                           "errors"}
          missing = expected_keys - set(soa.keys())
          assert not missing, f"SoA dict missing keys: {missing}"
          assert list(soa["n_per_file"]) == [5, 5, 5]
          assert soa["freq"].shape == (15,)
          assert soa["S"].shape == (15, 2, 2)
          assert all(e is None for e in soa["errors"])
          print("parse_and_compute_batch OK — N_files=3, total_N=15, keys=", sorted(soa.keys()))

          print("All smoke tests passed for", bins[0])
          PY

      - name: Commit and push if the binary changed
        # Only commits when `git status` shows a real diff under the bin
        # folder.  Adds "[skip ci]" so the resulting push doesn't loop
        # back into this workflow.
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/rf/ssm/rust_kernels/bin/linux_x86_64/
          if git diff --cached --quiet; then
            echo "No changes to commit — binary is already up to date."
            exit 0
          fi
          git commit -m "Build Linux x86_64 Rust kernel binary [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
