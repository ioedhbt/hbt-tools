name: Build Rust kernels (Linux x86_64)

# Builds the Linux x86_64 .so for `hbt_rust_kernels` and commits it back
# under `tools/SSM/rust_kernels/bin/linux_x86_64/` so Streamlit Cloud
# (which runs Linux but has no Rust toolchain) can use the accelerated
# CPU kernels.
#
# Triggers:
#   • push to IOED-Tools / main when any Rust source / build config changes
#   • manual run via the Actions tab (workflow_dispatch)
#
# Self-skip: when this workflow commits the rebuilt binary, the commit
# message ends with "[skip ci]" so it doesn't re-trigger itself.

on:
  push:
    branches: [IOED-Tools, main]
    paths:
      - "tools/SSM/rust_kernels/src/**"
      - "tools/SSM/rust_kernels/Cargo.toml"
      - "tools/SSM/rust_kernels/Cargo.lock"
      - "tools/SSM/rust_kernels/pyproject.toml"
      - "build_rust_kernels.py"
      - ".github/workflows/build-rust-linux.yml"
  workflow_dispatch:

permissions:
  contents: write   # required for `git push` from inside the workflow

concurrency:
  group: build-rust-linux-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node 24 now so the deprecation warnings on actions/* go away
# (the underlying actions are unchanged — only the runtime is bumped).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.9
        # Build-time interpreter only.  The wheel is abi3-py39, so the
        # resulting .so works on every Python ≥3.9 at runtime —
        # including Streamlit Cloud's 3.14.
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/SSM/rust_kernels/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/SSM/rust_kernels/Cargo.toml', 'tools/SSM/rust_kernels/src/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install maturin + numpy
        # maturin builds the wheel; numpy is needed for the smoke test below.
        run: python -m pip install --upgrade pip "maturin>=1.5,<2.0" numpy

      - name: Build wheel (release, abi3-py39)
        working-directory: tools/SSM/rust_kernels
        run: maturin build --release --out target/wheels

      - name: Extract .so into bin/linux_x86_64/
        # Pull the compiled extension out of the wheel and drop it into
        # the committed-binary directory.  Mirrors what
        # `build_rust_kernels.py::_extract_binary` does locally.
        run: |
          set -euo pipefail
          WHEEL=$(ls tools/SSM/rust_kernels/target/wheels/hbt_rust_kernels-*.whl | head -n1)
          echo "Wheel: $WHEEL"
          mkdir -p tools/SSM/rust_kernels/bin/linux_x86_64
          # Remove any stale binaries first so we don't leave abi3-py38
          # lying around once we've upgraded.
          rm -f tools/SSM/rust_kernels/bin/linux_x86_64/hbt_rust_kernels*.so
          python - "$WHEEL" <<'PY'
          import sys, zipfile, shutil, os
          from pathlib import Path
          wheel = Path(sys.argv[1])
          dest  = Path("tools/SSM/rust_kernels/bin/linux_x86_64")
          with zipfile.ZipFile(wheel) as z:
              members = [m for m in z.namelist()
                         if Path(m).name.startswith("hbt_rust_kernels")
                         and m.endswith(".so")]
              if not members:
                  raise SystemExit(f"No .so found in {wheel}")
              members.sort(key=lambda m: (len(m), m))
              src = members[0]
              out = dest / Path(src).name
              with z.open(src) as f, out.open("wb") as g:
                  shutil.copyfileobj(f, g)
              print(f"Extracted {src}  ->  {out}")
          PY
          ls -la tools/SSM/rust_kernels/bin/linux_x86_64/

      - name: Smoke test the built binary
        # Import the .so and call y_to_s_4d to confirm the public API
        # works before we commit.  numpy was installed above.
        run: |
          python - <<'PY'
          import sys, glob, numpy as np
          bins = sorted(glob.glob("tools/SSM/rust_kernels/bin/linux_x86_64/hbt_rust_kernels*.so"))
          assert bins, "no .so found"
          sys.path.insert(0, "tools/SSM/rust_kernels/bin/linux_x86_64")
          import hbt_rust_kernels as rk
          Y = (np.random.randn(4, 8, 2, 2) + 1j*np.random.randn(4, 8, 2, 2)).astype(np.complex128) * 0.01
          S = rk.y_to_s_4d(Y, 50.0)
          assert S.shape == Y.shape and S.dtype == np.complex128
          print("Smoke test OK, binary:", bins[0], "output shape:", S.shape)
          PY

      - name: Commit and push if the binary changed
        # Only commits when `git status` shows a real diff under the bin
        # folder.  Adds "[skip ci]" so the resulting push doesn't loop
        # back into this workflow.
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/SSM/rust_kernels/bin/linux_x86_64/
          if git diff --cached --quiet; then
            echo "No changes to commit — binary is already up to date."
            exit 0
          fi
          git commit -m "Build Linux x86_64 Rust kernel binary [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
