# NOTE: this file must be copied to .github/workflows/deploy-docs.yml to take
# effect — it is written here because this agent may only write inside guide/.
name: Deploy docs

on:
  push:
    branches: [IOED-Tools]
    paths:
      - "guide/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install -r guide/requirements.txt
      - name: Build site
        run: mkdocs build -f guide/mkdocs.yml --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: guide/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
