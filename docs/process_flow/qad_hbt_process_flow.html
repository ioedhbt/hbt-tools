/* --- per-step scene construction ---------------------------------------- */
function buildScene(k, t){
  waferHUD = null;
  const P = stepEndP(k-1);

  if (k === 1){
    // wafer -> scribe lanes -> lift one die out of its socket
    const spin = ease(seg(t,0,0.24));
    const grid = seg(t,0.30,0.46);
    const cut  = seg(t,0.42,0.86);
    const lift = easeOut(cut)*DIE*2.0;               // clear of the socket it left
    // once it is clear of the socket the camera leaves the wafer behind and
    // closes on the die, which is all the rest of the flow happens on
    const zoom = ease(seg(t,0.58,1.0));
    blendView(VIEW_WAFER, dieView(lift), zoom);
    autoAzim = lerp(-0.62, DEF_AZ, spin);
    drawWafer(1, grid, lift, cut > 0.004);
    waferHUD = {lift, cut, a:1, flats:1-zoom};
    return;
  }

  if (k === 2){
    const z1 = ease(seg(t,0.00,0.12));
    const wa = 1 - clamp01(z1*2.4);                   // wafer hands over to device
    const lift = DIE*2.0*(1-z1);
    blendView(dieView(lift), devView(k), z1);
    drawWafer(wa, wa, lift, wa > 0.004);
    if (wa > 0.25) waferHUD = {lift, cut:1, a:wa, flats:0};
    P.ghost = 1 - clamp01((z1-0.42)/0.30);
  } else {
    setView(devView(k));
  }

  switch(k){
  case 2: {
    // single resist over the flat epi; the mask's only chrome is the E-mesa
    // rectangle, so the field around it is what is clear and gets exposed
    const co = ease(seg(t,0.14,0.28));                // spin the resist
    const la = ease(seg(t,0.34,0.42));                // latent image, once exposed
    const dv = ease(seg(t,0.46,0.56));                // develop to the E-mesa island
    const e1 = ease(seg(t,0.58,0.68));                // citric: two InGaAs caps
    const e2 = ease(seg(t,0.68,0.90));                // HCl: InP + AlInP
    const st = ease(seg(t,0.94,1.0));                 // strip
    const RT = 1300;
    P.emEtchY = e2 > 0 ? lerp(Y_INP_TOP, Y_BASE_TOP, e2)
                       : lerp(EPI_TOP, Y_INP_TOP, e1);
    P.emUC = ease(seg(t,0.70,0.92));
    if (co > 0)
      P.resist = {kind:'single', y0:EPI_TOP, thk:RT, coat:co, latent:la, dev:dv,
                  fade:1-st, keep:[EMESA]};
    if (t > 0.30 && t < 0.44)
      P.fx = {kind:'uv', y0:EPI_TOP + RT, t:t*6, open: rectCells(FP_FULL(), [EMESA])};
    else if ((e1 > 0 && e1 < 1) || (e2 > 0 && e2 < 1))
      P.fx = {kind:'wet', y:P.emEtchY, yTop:EPI_TOP + RT, t:t*6};
    break;
  }
  case 3: {
    // resist drapes over the already-standing E-mesa for free (drapedShell
    // reads topoHeight); the mask's chrome is the BC-mesa rectangle
    const co = ease(seg(t,0.06,0.22));                // resist drapes over the E-mesa
    const la = ease(seg(t,0.30,0.38));                // latent image, once exposed
    const dv = ease(seg(t,0.42,0.52));                // develop to the BC-mesa island
    const e1 = ease(seg(t,0.54,0.64));                // citric: GaAsSb base
    const e2 = ease(seg(t,0.64,0.88));                // HCl: collector + sub-collector InP
    const st = ease(seg(t,0.93,1.0));                 // strip
    const RT = 1300;
    P.bcEtchY = e2 > 0 ? lerp(Y_BC_INP, Y_SC_TOP, e2)
                       : lerp(Y_BASE_TOP, Y_BC_INP, e1);
    P.bcUC = ease(seg(t,0.66,0.90));
    if (co > 0)
      P.resist = {kind:'single', y0:Y_BASE_TOP, thk:RT, coat:co, latent:la, dev:dv,
                  fade:1-st, keep:[BCMESA]};
    if (t > 0.26 && t < 0.40)
      P.fx = {kind:'uv', y0:Y_BASE_TOP + RT, t:t*6, open: rectCells(FP_FULL(), [BCMESA])};
    else if ((e1 > 0 && e1 < 1) || (e2 > 0 && e2 < 1))
      P.fx = {kind:'wet', y:P.bcEtchY, yTop:EPI_TOP, t:t*6};
    break;
  }
  case 4: {
    // two-layer lift-off: EM, CM and all six pads open in the same mask
    const g1 = ease(seg(t,0.05,0.13)), g2 = ease(seg(t,0.13,0.20));
    const la = ease(seg(t,0.26,0.34));                // latent image, once exposed
    const dT = ease(seg(t,0.38,0.46));                // develop the top layer
    const dB = ease(seg(t,0.54,0.64));                // DUV -> bottom clears wider
    const ev = ease(seg(t,0.70,0.88));                // evaporate
    const lo = ease(seg(t,0.93,1.0));                 // lift-off
    const T1 = 1400, T2 = 500;
    const OPEN = [EM_R, ...CM_PARTS, ...PADS];
    P.emH = EM_H * ev; P.cmH = CM_H * ev;
    if (t >= 0.05)
      P.resist = {kind:'bi', y0:Y_SC_TOP, t1:T1, t2:T2, grow1:g1, grow2:g2,
                  devT:dT, devB:dB, open:OPEN, over:EM_H*ev, fade:1-lo, lift:900*lo*lo};
    if (t > 0.22 && t < 0.36)
      P.fx = {kind:'uv', y0:Y_SC_TOP + T1 + T2, t:t*6, open:OPEN};
    else if (t > 0.48 && t < 0.58)
      P.fx = {kind:'duv', y0:Y_SC_TOP + T1 + T2, t:t*6};
    else if (ev > 0 && ev < 1)
      P.fx = {kind:'flux', y0:Y_SC_TOP + T1 + T2 + 500, t:t*6};
    break;
  }
  case 5: {
    // same lift-off scheme, this time opening only the base-metal U
    const g1 = ease(seg(t,0.05,0.13)), g2 = ease(seg(t,0.13,0.20));
    const la = ease(seg(t,0.26,0.34));                // latent image, once exposed
    const dT = ease(seg(t,0.38,0.46));                // develop the top layer
    const dB = ease(seg(t,0.54,0.64));                // DUV -> bottom clears wider
    const ev = ease(seg(t,0.70,0.88));                // evaporate
    const lo = ease(seg(t,0.93,1.0));                 // lift-off
    const T1 = 1400, T2 = 500;
    P.bmH = BM_H * ev;
    if (t >= 0.05)
      P.resist = {kind:'bi', y0:Y_BASE_TOP, t1:T1, t2:T2, grow1:g1, grow2:g2,
                  devT:dT, devB:dB, open:BM_PARTS, over:BM_H*ev, fade:1-lo, lift:900*lo*lo};
    if (t > 0.22 && t < 0.36)
      P.fx = {kind:'uv', y0:Y_BASE_TOP + T1 + T2, t:t*6, open:BM_PARTS};
    else if (t > 0.48 && t < 0.58)
      P.fx = {kind:'duv', y0:Y_BASE_TOP + T1 + T2, t:t*6};
    else if (ev > 0 && ev < 1)
      P.fx = {kind:'flux', y0:Y_BASE_TOP + T1 + T2 + 500, t:t*6};
    break;
  }
  case 6: {
    // conformal resist over the whole raised topography; the six pads need
    // none of it, since the metal itself masks the etch underneath them
    const co = ease(seg(t,0.04,0.20));                // resist humps over everything
    const la = ease(seg(t,0.28,0.36));                // latent image, once exposed
    const dv = ease(seg(t,0.40,0.50));                // develop: island + self-masked pads
    const e1 = ease(seg(t,0.52,0.62));                // citric: L3 InGaAs
    const e2 = ease(seg(t,0.62,0.84));                // HCl: L2 InP, undercutting
    const e3 = ease(seg(t,0.84,0.92));                // citric: L1 etch stop
    const st = ease(seg(t,0.95,1.0));                 // strip
    const RT = 1400, yL3 = EPI.find(l=>l.i===3).y0, yL2 = EPI.find(l=>l.i===2).y0;
    P.isoEtchY = e3 > 0 ? lerp(yL2, SUBTOP, e3)
               : e2 > 0 ? lerp(yL3, yL2, e2)
                        : lerp(Y_SC_TOP, yL3, e1);
    P.isoUC = ease(seg(t,0.64,0.90));
    if (co > 0)
      P.resist = {kind:'single', y0:Y_SC_TOP, thk:RT, coat:co, latent:la, dev:dv,
                  fade:1-st, keep:[ISO]};
    if (t > 0.24 && t < 0.38)
      P.fx = {kind:'uv', y0:Y_SC_TOP + RT, t:t*6, open: rectCells(FP_FULL(), [ISO])};
    else if (e1 > 0 && e3 < 1)
      P.fx = {kind:'wet', y:P.isoEtchY, yTop:EPI_TOP + EM_H, t:t*6};
    break;
  }
  case 7: {
    // spin -> conformal liquid; cure -> planar.  Nothing here needs a
    // strip/etch beat to time against — that comes next, in step 8.
    const flow = ease(seg(t,0.06,0.42));              // spin: the liquid wets it
    const cure = ease(seg(t,0.54,1.0));               // slow ramp: it reflows flat
    P.bcbTop  = lerp(0, BCB_CONF, flow) + (BCB_TOP - BCB_CONF) * cure;
    P.bcbConf = flow * (1 - cure);
    P.bcbCure = cure;
    break;
  }
  case 8: {
    // resist spins onto the already-planar cured BCB, so it goes on flat --
    // no drape, unlike every earlier resist coat in this flow.  The mask's
    // only chrome is the field itself: the nine vias are its windows, so
    // they are what is clear and gets exposed (same convention as the
    // lift-off masks in steps 4/5, where `open` is the small exposed shapes
    // rather than the field rectCells() leaves once the big protected shape
    // is cut out, as in steps 2/3/6).
    const co = ease(seg(t,0.06,0.24));                // spin, flat
    const la = ease(seg(t,0.32,0.40));                // latent image, once exposed
    const dv = ease(seg(t,0.44,0.58));                // develop: nine openings
    const et = ease(seg(t,0.62,0.90));                // CF4/O2 RIE: BCB thins to metal
    const st = ease(seg(t,0.94,1.0));                 // strip
    const RT = 1300;
    P.via = et;
    if (co > 0)
      P.resist = {kind:'single', y0:P.bcbTop, thk:RT, coat:co, latent:la, dev:dv,
                  fade:1-st, flat:true, holes: VIAS};
    if (t > 0.28 && t < 0.42)
      P.fx = {kind:'uv', y0:P.bcbTop + RT, t:t*6, open: VIAS};
    else if (et > 0 && et < 1)
      P.fx = {kind:'wet', y:lerp(P.bcbTop, Y_SC_TOP + CM_H, et), yTop:P.bcbTop + RT, t:t*6};
    break;
  }
  case 9: {
    // same two-layer lift-off scheme as steps 4/5, but spun flat onto the
    // already-planar, via-opened BCB (kind:'bi' with flat:true) rather than
    // draping over a raised mesa; the five M1 rectangles are its opening
    const g1 = ease(seg(t,0.05,0.13)), g2 = ease(seg(t,0.13,0.20));
    const la = ease(seg(t,0.26,0.34));                // latent image, once exposed
    const dT = ease(seg(t,0.38,0.46));                // develop the top layer
    const dB = ease(seg(t,0.54,0.64));                // DUV -> bottom clears wider
    const ev = ease(seg(t,0.70,0.88));                // evaporate
    const lo = ease(seg(t,0.93,1.0));                 // lift-off
    const T1 = 1400, T2 = 500;
    P.padH = M1_H * ev;
    if (t >= 0.05)
      P.resist = {kind:'bi', y0:BCB_TOP, t1:T1, t2:T2, grow1:g1, grow2:g2,
                  devT:dT, devB:dB, open:M1_PARTS, over:M1_H*ev, fade:1-lo,
                  lift:900*lo*lo, flat:true};
    if (t > 0.22 && t < 0.36)
      P.fx = {kind:'uv', y0:BCB_TOP + T1 + T2, t:t*6, open:M1_PARTS};
    else if (t > 0.48 && t < 0.58)
      P.fx = {kind:'duv', y0:BCB_TOP + T1 + T2, t:t*6};
    else if (ev > 0 && ev < 1)
      P.fx = {kind:'flux', y0:BCB_TOP + T1 + T2 + 500, t:t*6};
    break;
  }}
  drawDevice(P);
}

/* ---------------------------------------------------------------------------
 * 11.  Camera
 *
 * Every step asks for its own framing: VIEW_WAFER while the wafer is still
 * whole, dieView() for the freed die, VIEW_FULL once the BC mesa and the
 * collector U are the whole story, VIEW_PAD from the isolation etch on, once
 * the six probe pads and the island are what the step is about, and VIEW_XS
 * for the cross-section close-up.  There are no posts and no airbridge in
 * this flow, so — unlike the formal flow — there is nothing else to focus on.
 * ------------------------------------------------------------------------ */
const VIEW_WAFER = {fit:4.5e7, target:[0, 2e6, 0], el:0.86};
// the freed die, framed on its own — where step 1 ends and step 2 starts
const dieView = lift => ({fit:1.16e7, target:[0, lift, 0], el:0.55});
// through step 5: BC mesa + collector U, outer edge x +-15500, z -16000..11000
const VIEW_FULL = {fit:40000, target:[0, 400, -2500], el:0.50, az:0.55};
// step 6 on: the whole GSG, pads reach x +-31000, z -37500..+32500
const VIEW_PAD  = {fit:86000, target:[0, 300, -2500],  el:0.46, az:0.55};
// cross-section close-up; CUT_Z = -3000 cuts through the emitter mesa centre
const VIEW_XS   = {fit:9000,  target:[0, 500, -3000], el:0.26, az:0.34};

const devView = k => CUTAWAY ? VIEW_XS : (k >= 6 ? VIEW_PAD : VIEW_FULL);

const DEF_AZ = 0.55, DEF_EL = 0.42;
let azim = DEF_AZ, elev = DEF_EL, zoomMul = 1, autoAzim = null, userTouched = false;
let viewProj = new Float32Array(16), eye = [0,0,0];

let viewFit = VIEW_FULL.fit, viewTarget = VIEW_FULL.target.slice();
let autoElev = VIEW_FULL.el;
function setView(v){
  viewFit = v.fit; viewTarget = v.target.slice(); autoElev = v.el;
  if (v.az !== undefined) autoAzim = v.az;
}
function blendView(a, b, t){
  viewFit = logLerp(a.fit, b.fit, t);
  viewTarget = [lerp(a.target[0],b.target[0],t), lerp(a.target[1],b.target[1],t),
                lerp(a.target[2],b.target[2],t)];
  autoElev = lerp(a.el, b.el, t);
  const az0 = a.az === undefined ? DEF_AZ : a.az, az1 = b.az === undefined ? DEF_AZ : b.az;
  autoAzim = lerp(az0, az1, t);
}

const view = document.getElementById('view');
let dragging = false, lx = 0, ly = 0;
view.addEventListener('pointerdown', e => {
  if (!userTouched){                       // adopt the automatic camera first
    if (autoAzim !== null) azim = autoAzim;
    if (autoElev !== null) elev = autoElev;
  }
  dragging = true; userTouched = true; lx = e.clientX; ly = e.clientY;
  view.setPointerCapture(e.pointerId);
});
view.addEventListener('pointermove', e => {
  if (!dragging) return;
  azim -= (e.clientX - lx) * 0.007;
  elev = Math.max(-0.25, Math.min(1.42, elev + (e.clientY - ly) * 0.006));
  lx = e.clientX; ly = e.clientY;
});
const stopDrag = () => { dragging = false; };
view.addEventListener('pointerup', stopDrag);
view.addEventListener('pointercancel', stopDrag);
view.addEventListener('wheel', e => {
  e.preventDefault(); userTouched = true;
  zoomMul = Math.max(0.28, Math.min(3.2, zoomMul * Math.exp(e.deltaY * 0.0012)));
}, {passive:false});

function resetView(){ azim = DEF_AZ; elev = DEF_EL; zoomMul = 1; userTouched = false; }
document.getElementById('resetview').addEventListener('click', resetView);

const xsecBtn = document.getElementById('xsec');
xsecBtn.addEventListener('click', () => {
  CUTAWAY = !CUTAWAY;
  xsecBtn.classList.toggle('on', CUTAWAY);
  userTouched = false;                      // let the view swing to the new framing
});

/**
 * Chase the requested framing rather than cutting to it — smooths the
 * deliberate blends in step 1 and keeps drag-orbit from feeling abrupt.
 * Reads viewFit/viewTarget/autoElev/autoAzim (written by setView/blendView
 * and the pointer handlers above) and leaves the eased result in
 * camFit/camTgt/camEl/camAz plus the derived eye/viewProj/camRight/camUp/
 * camFwd that section 12's render pass and the HUD both read.
 */
function updateCamera(){
  const azT = (autoAzim !== null && !userTouched) ? autoAzim : azim;
  const elT = (autoElev !== null && !userTouched) ? autoElev : elev;
  if (camFit === null){
    camFit = viewFit; camTgt = viewTarget.slice(); camEl = elT; camAz = azT;
  } else {
    const k = 0.22;
    camFit = Math.exp(lerp(Math.log(camFit), Math.log(viewFit), k));
    for (let i=0;i<3;i++) camTgt[i] = lerp(camTgt[i], viewTarget[i], k);
    camEl = lerp(camEl, elT, k);
    camAz = lerp(camAz, azT, k);
  }
  const az = camAz, el = camEl;
  const dist = (camFit * zoomMul) / Math.tan(0.26);
  const ce = Math.cos(el), se = Math.sin(el);
  eye = [camTgt[0] + dist*ce*Math.sin(az),
         camTgt[1] + dist*se,
         camTgt[2] + dist*ce*Math.cos(az)];
  const Vm = lookAt(eye, camTgt, [0,1,0]);
  const Pm = perspective(0.52, W/H, dist*0.02, dist*9);
  viewProj = mul(Pm, Vm);
  camRight = [Math.cos(az), 0, -Math.sin(az)];
  camFwd   = [-ce*Math.sin(az), -se, -ce*Math.cos(az)];
  camUp    = [-se*Math.sin(az),  ce, -se*Math.cos(az)];
}

/* ---------------------------------------------------------------------------
 * 12.  Draw
 * ------------------------------------------------------------------------ */
const hudCanvas = document.getElementById('hud');
const hud = hudCanvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = view.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
  for (const c of [glCanvas, hudCanvas]){ c.width = W*DPR; c.height = H*DPR; }
  if (gl) gl.viewport(0, 0, W*DPR, H*DPR);
  hud.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

/* Theme lookups touch layout, so they are cached and invalidated by hand. */
let themeCache = null;
function themeDirty(){ themeCache = null; }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeDirty);
function theme(){
  if (themeCache) return themeCache;
  const cs = getComputedStyle(document.body);
  const get = n => cs.getPropertyValue(n).trim();
  const rgb = n => { const v = get(n);
    if (v.startsWith('#')) return hex(v);
    const m = v.match(/[\d.]+/g); return m ? [m[0]/255, m[1]/255, m[2]/255] : [0,0,0]; };
  themeCache = {
    bg: rgb('--viewport'), edge: rgb('--text'),
    text: get('--text'), muted: get('--muted'), rule: get('--rule'),
    panel: get('--panel'), accent: get('--accent'),
  };
  return themeCache;
}
const HUD_FONT = '11px ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC", monospace';

/** One GL pass: opaque chunks depth-written, then blend chunks sorted
 *  back-to-front by eye distance with depth write off, then additive
 *  chunks, then the unlit edge lines from LV. */
function drawFrame(){
  if (!gl) return;
  const TH = theme();
  const bg = TH.bg;
  EDGE = TH.edge; EDGE_A = 0.3;

  updateCamera();

  gl.clearColor(bg[0], bg[1], bg[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(prog);
  gl.uniformMatrix4fv(loc.uVP, false, viewProj);
  const l1 = [0.42, 0.80, 0.43], l2 = [-0.55, 0.30, -0.42];
  gl.uniform3fv(loc.uL1, l1); gl.uniform3fv(loc.uL2, l2);
  gl.uniform1f(loc.uAmb, 0.34);

  // ---- triangles
  const arr = new Float32Array(V);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
  const stride = 40;
  gl.enableVertexAttribArray(loc.aPos); gl.vertexAttribPointer(loc.aPos,3,gl.FLOAT,false,stride,0);
  gl.enableVertexAttribArray(loc.aNrm); gl.vertexAttribPointer(loc.aNrm,3,gl.FLOAT,false,stride,12);
  gl.enableVertexAttribArray(loc.aCol); gl.vertexAttribPointer(loc.aCol,4,gl.FLOAT,false,stride,24);
  gl.uniform1f(loc.uUnlit, 0);

  // fills are nudged away from the eye so the wireframe edges win the depth test
  gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1.2, 1.2);
  gl.disable(gl.BLEND); gl.depthMask(true);
  for (const c of chunks) if (c.mode === 'opaque') gl.drawArrays(gl.TRIANGLES, c.s, c.n);

  // ---- edges
  if (LV.length){
    const la = new Float32Array(LV);
    gl.bindBuffer(gl.ARRAY_BUFFER, lbo);
    gl.bufferData(gl.ARRAY_BUFFER, la, gl.DYNAMIC_DRAW);
    gl.vertexAttribPointer(loc.aPos,3,gl.FLOAT,false,28,0);
    gl.disableVertexAttribArray(loc.aNrm);
    gl.vertexAttribPointer(loc.aCol,4,gl.FLOAT,false,28,12);
    gl.uniform1f(loc.uUnlit, 1);
    gl.enable(gl.BLEND); gl.depthMask(false);
    gl.drawArrays(gl.LINES, 0, LV.length/7);
    gl.enableVertexAttribArray(loc.aNrm);
    gl.uniform1f(loc.uUnlit, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.vertexAttribPointer(loc.aPos,3,gl.FLOAT,false,stride,0);
    gl.vertexAttribPointer(loc.aNrm,3,gl.FLOAT,false,stride,12);
    gl.vertexAttribPointer(loc.aCol,4,gl.FLOAT,false,stride,24);
  }

  // ---- alpha, back to front
  const blend = chunks.filter(c => c.mode === 'blend');
  for (const c of blend){
    const dx=c.c[0]-eye[0], dy=c.c[1]-eye[1], dz=c.c[2]-eye[2];
    c.d = dx*dx+dy*dy+dz*dz;
  }
  blend.sort((a,b) => b.d - a.d);
  // Resist and BCB are drawn as solid blocks that swallow the device, so on
  // the cut face their walls are coplanar with every device wall.  Pushing the
  // transparent pass further back in depth makes the solid underneath win that
  // tie outright, instead of the two speckling against each other.
  gl.polygonOffset(6.0, 6.0);
  gl.enable(gl.BLEND); gl.depthMask(false);
  gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  for (const c of blend) gl.drawArrays(gl.TRIANGLES, c.s, c.n);

  // ---- additive
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  for (const c of chunks) if (c.mode === 'add') gl.drawArrays(gl.TRIANGLES, c.s, c.n);
  gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(true);
  gl.polygonOffset(1.2, 1.2);
  gl.disable(gl.POLYGON_OFFSET_FILL);
}

/** resetGeom() + buildScene(k,t) + the GL pass, in the order a frame needs
 *  them.  The loop (section 15) calls this once per frame, then the HUD
 *  pass (section 13) on top of it. */
function scene(k, t){
  resetGeom();
  buildScene(k, t);
  drawFrame();
}

/* ---------------------------------------------------------------------------
 * 13.  HUD — layer callouts, scale bar
 *
 * No write-pattern inset here: every mask in this flow is MA6 contact UV, so
 * there is no e-beam field to preview, unlike the formal flow's section 12.
 * ------------------------------------------------------------------------ */
function project(p){
  const m = viewProj;
  const x = m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12];
  const y = m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13];
  const w = m[3]*p[0]+m[7]*p[1]+m[11]*p[2]+m[15];
  if (w <= 0) return null;
  return [(x/w*0.5+0.5)*W, (1-(y/w*0.5+0.5))*H];
}

function drawHUD(k, t){
  hud.clearRect(0,0,W,H);
  const TH = theme();
  const textC = TH.text, mutedC = TH.muted, ruleC = TH.rule;
  hud.font = HUD_FONT;

  // ---- scale bar --------------------------------------------------------
  const pxPerUnit = (H*0.5) / ((camFit || viewFit)*zoomMul);   // px per nm at the target
  const targetPx = 118;
  let len = targetPx / pxPerUnit;                      // in nm
  const pow = Math.pow(10, Math.floor(Math.log10(len)));
  const nice = [1,2,5,10].find(n => n*pow >= len*0.55) || 10;
  len = nice*pow;
  const px = len * pxPerUnit;
  const bx = W - px - 24, by = H - 26;
  hud.strokeStyle = mutedC; hud.lineWidth = 1;
  hud.beginPath();
  hud.moveTo(bx, by-4); hud.lineTo(bx, by+4); hud.moveTo(bx, by); hud.lineTo(bx+px, by);
  hud.moveTo(bx+px, by-4); hud.lineTo(bx+px, by+4);
  hud.stroke();
  const lab = len >= 1e6 ? (len/1e6)+' mm' : len >= 1e3 ? (len/1e3)+' µm' : len+' nm';
  hud.fillStyle = mutedC; hud.textAlign = 'center';
  hud.fillText(lab, bx+px/2, by-9);
  hud.textAlign = 'left';

  // ---- crystal orientation triad ---------------------------------------
  {
    const ox = W - 82, oy = 62, L = 22;
    hud.fillStyle = TH.panel; hud.globalAlpha = 0.90;      // legible over any scene
    hud.fillRect(ox-66, oy-38, 132, 96); hud.globalAlpha = 1;
    hud.strokeStyle = ruleC; hud.lineWidth = 1;
    hud.strokeRect(ox-65.5, oy-37.5, 131, 95);
    const scr = v => [ v[0]*camRight[0] + v[1]*camRight[1] + v[2]*camRight[2],
                     -(v[0]*camUp[0]    + v[1]*camUp[1]    + v[2]*camUp[2]) ];
    const away = v => v[0]*camFwd[0] + v[1]*camFwd[1] + v[2]*camFwd[2];
    const arms = AXES.map(a => ({lab:a.lab, s:scr(a.v), d:away(a.v), up:a.v[1] === 1}))
                     .sort((p,q) => q.d - p.d);          // the one going away, first
    for (const a of arms){
      const m = Math.hypot(a.s[0], a.s[1]);
      const tx = ox + a.s[0]*L, ty = oy + a.s[1]*L;
      hud.globalAlpha = 0.32 + 0.68*m;
      hud.strokeStyle = a.up ? TH.accent : mutedC;
      hud.lineWidth = a.up ? 1.5 : 1.15;
      hud.beginPath(); hud.moveTo(ox, oy); hud.lineTo(tx, ty); hud.stroke();
      hud.beginPath(); hud.arc(tx, ty, 1.7, 0, 6.2832);
      hud.fillStyle = a.up ? TH.accent : mutedC; hud.fill();
      hud.fillStyle = a.up ? TH.accent : textC;
      hud.textAlign = a.s[0] > 0.2 ? 'left' : a.s[0] < -0.2 ? 'right' : 'center';
      hud.fillText(a.lab, tx + a.s[0]*7, ty + a.s[1]*7 + 3.5);
    }
    hud.globalAlpha = 1;
    hud.fillStyle = mutedC; hud.textAlign = 'center';
    hud.fillText('(100) InP', ox, oy + 48);
    hud.textAlign = 'left';
  }

  const tag = (p3, text, dx, dy, align) => {
    const p = project(p3); if (!p) return;
    hud.strokeStyle = mutedC; hud.lineWidth = 1;
    hud.beginPath(); hud.moveTo(p[0], p[1]); hud.lineTo(p[0]+dx, p[1]+dy); hud.stroke();
    hud.fillStyle = textC; hud.textAlign = align;
    hud.fillText(text, p[0]+dx + (align === 'right' ? -6 : 6), p[1]+dy + 3.5);
    hud.textAlign = 'left';
    hud.beginPath(); hud.arc(p[0], p[1], 2, 0, 6.2832); hud.fillStyle = mutedC; hud.fill();
  };
  // ---- device labels: each fades in as its feature settles, then holds --
  const mesaA = k > 2 ? 1 : k === 2 ? clamp01((t-0.94)/0.06) : 0;
  if (mesaA > 0.01){
    hud.globalAlpha = mesaA;
    tag([0, EPI_TOP, EMESA.z1], TR('emitter mesa'), 28, -26, 'left');
    hud.globalAlpha = 1;
  }
  const bcA = k > 3 ? 1 : k === 3 ? clamp01((t-0.93)/0.07) : 0;
  if (bcA > 0.01){
    hud.globalAlpha = bcA;
    tag([0, Y_BASE_TOP, BCMESA.z1], TR('base–collector mesa'), -28, 30, 'right');
    hud.globalAlpha = 1;
  }
  // emitter metal, collector metal and the six pads all land in one run (step 4)
  const cmA = k > 4 ? 1 : k === 4 ? clamp01((t-0.92)/0.08) : 0;
  if (cmA > 0.01){
    hud.globalAlpha = cmA;
    tag([0, EPI_TOP + EM_H, (EM_R.z0+EM_R.z1)/2], 'E', 22, -20, 'left');
    tag([0, Y_SC_TOP + CM_H, (CM_BAR.z0+CM_BAR.z1)/2], 'C', -22, 24, 'right');
    // once M1 lands (step 9) the probe pads are what a probe actually lands
    // on, so the role labels lift off the buried CM/pad metal onto the M1
    // pad above it -- before that, padA is 0 and this is a no-op
    const padA = k > 9 ? 1 : k === 9 ? clamp01((t-0.90)/0.10) : 0;
    const padY = Y_SC_TOP + CM_H + M1_H * padA;
    for (const p of PADS){
      const cx = (p.x0+p.x1)/2, cz = (p.z0+p.z1)/2;
      const label = p.role === 'B' ? TR('B · port 1')
                   : p.role === 'C' ? TR('C · port 2') : TR('Ground');
      tag([cx, padY, cz], label,
          cx < 0 ? -24 : 24, cz > 0 ? -22 : 22, cx < 0 ? 'right' : 'left');
    }
    hud.globalAlpha = 1;
  }
  const bmA = k > 5 ? 1 : k === 5 ? clamp01((t-0.92)/0.08) : 0;
  if (bmA > 0.01){
    hud.globalAlpha = bmA;
    tag([0, Y_BASE_TOP + BM_H, (BM_BAR.z0+BM_BAR.z1)/2], 'B', 22, 20, 'left');
    hud.globalAlpha = 1;
  }

  // ---- wafer callouts: the flats are what set the crystal orientation ----
  if (waferHUD){
    const fa = waferHUD.flats === undefined ? 1 : waferHUD.flats;
    if (fa > 0.01){                        // they go as the camera leaves the wafer
      hud.globalAlpha = waferHUD.a * fa;
      tag([0, WGRID, WPRI],   TR('primary flat'),   -26,  40, 'right');
      tag([WSEC, WGRID, 0],   TR('secondary flat'),  46,  22, 'left');
      tag([-WR*0.80, WGRID, -WR*0.60], '⌀ 76 mm', -30, -22, 'right');
    }
    hud.globalAlpha = waferHUD.a;
    if (waferHUD.cut > 0.05)
      tag([DIE/2, waferHUD.lift, -DIE/2], TR('12 × 12 mm² die'), 40, -30, 'left');
    hud.globalAlpha = 1;
  }
}

/* ---------------------------------------------------------------------------
 * 14.  Flow rail, dossier, transport
 * ------------------------------------------------------------------------ */
let cur = 1, tt = 0, playing = false, playAll = false, speed = 1;

const flowEl = document.getElementById('flow');
const rows = [];
function buildRail(){
  flowEl.innerHTML = '';
  rows.length = 0;
  for (const S of STEPS.slice(0, STEPS_SHOWN)){
    const segRow = document.createElement('li');
    segRow.className = 'frow seg';
    segRow.innerHTML =
      '<button class="hit" aria-label="' + TRF(TR('Play step {n}'), {n:S.n})
        + ': ' + S.title + '"></button>' +
      '<span class="gfx"><span class="stem"></span></span>' +
      '<span class="txt">' + (S.n === 1 ? TR('start ▸') : TR('▸ animate')) + '</span>';
    segRow.querySelector('.hit').addEventListener('click', () => play(S.n));
    flowEl.appendChild(segRow);

    const dotRow = document.createElement('li');
    dotRow.className = 'frow dot';
    dotRow.innerHTML =
      '<button class="hit" aria-label="'
        + TRF(TR('Show state after step {n}'), {n:S.n}) + '"></button>' +
      '<span class="gfx"><span class="mark"></span></span>' +
      '<span class="txt"><span class="num">' + String(S.n).padStart(2,'0') + '</span>' + S.title + '</span>';
    dotRow.querySelector('.hit').addEventListener('click', () => jump(S.n));
    flowEl.appendChild(dotRow);
    rows.push({seg:segRow, dot:dotRow, stem:segRow.querySelector('.stem')});
  }
}

const el = {
  eyebrow: document.getElementById('i-eyebrow'),
  title:   document.getElementById('i-title'),
  body:    document.getElementById('i-body'),
  facts:   document.getElementById('i-facts'),
  stackBody: document.querySelector('#i-stack tbody'),
  stage:   document.getElementById('stagetxt'),
  badge:   document.getElementById('badge'),
  zoomchip:document.getElementById('zoomchip'),
};

/** STEPS_SHOWN === STEPS.length in this file, so `hidden` is always 0 and the
 *  note stays empty — the code path is kept for when a later step needs to
 *  be held back for verification, exactly as in the formal flow. */
function railNote(){
  const hidden = STEPS.length - STEPS_SHOWN;
  document.getElementById('railnote').textContent = hidden > 0
    ? TRF(TR('Steps {a}–{b} ({name} onward) are hidden while these are verified.'),
          {a:STEPS_SHOWN+1, b:STEPS.length,
           name:STEPS[STEPS_SHOWN].title.toLowerCase()})
    : '';
}

function fillStack(){
  // the layer number lives inside its own colour, so the two read as one thing
  const chip = (col, txt) => {
    const c = hex(col), lum = c[0]*0.299 + c[1]*0.587 + c[2]*0.114;
    return '<span class="nchip" style="background:' + col + ';color:'
         + (lum > 0.6 ? '#12141f' : '#f4f6ff') + '">' + txt + '</span>';
  };
  const nm = t => (t % 1 ? t.toFixed(1) : t);
  const rowsHtml = [];
  for (let i = EPI.length-1; i >= 0; i--){
    const L = EPI[i];
    rowsHtml.push(
      '<tr data-i="'+L.i+'"><td>'+chip(L.col, L.i)+'</td><td class="nm">'
      + TR(L.name) + ' <span style="color:var(--muted)">' + L.mat + '</span></td>'
      + '<td class="r">'+nm(L.t)+'</td><td class="r">'+L.type+'</td></tr>');
  }
  rowsHtml.push('<tr data-i="0"><td>'+chip(C.sub,'&nbsp;')
    +'</td><td class="nm">' + TR('Substrate')
    +' <span style="color:var(--muted)">S.I. InP</span></td>'
    +'<td class="r">—</td><td class="r">—</td></tr>');
  el.stackBody.innerHTML = rowsHtml.join('');
}

function syncPanel(){
  const S = STEPS[cur-1];
  el.eyebrow.textContent = TRF(TR('Step {n} of {t}'), {n:S.n, t:STEPS_SHOWN});
  el.title.textContent = S.title;                  // step names stay English
  el.body.textContent = TR(S.body);
  el.facts.innerHTML = S.facts.map(f =>
    '<div><dt>'+TR(f[0])+'</dt><dd>'+TR(f[1])+'</dd></div>').join('');

  // grey out a layer once it stops being a blanket film: emitter etch (step
  // 2) leaves 12->7 standing only on the E-mesa; base-collector etch (step
  // 3) leaves 6->4 standing only on the BC mesa; isolation (step 6) leaves
  // 3->1 standing only on the island.
  const goneFrom = {2:[7,8,9,10,11,12], 3:[4,5,6], 6:[1,2,3]};
  const gone = new Set();
  for (const step of Object.keys(goneFrom))
    if (cur >= +step) for (const i of goneFrom[step]) gone.add(i);
  for (const tr of el.stackBody.children){
    tr.classList.toggle('gone', gone.has(+tr.dataset.i));
  }

  for (let i=0;i<rows.length;i++){
    const r = rows[i], n = i+1;
    r.dot.classList.toggle('done', n < cur);
    r.dot.classList.toggle('here', n === cur);
    r.seg.classList.toggle('done', n < cur);
    r.seg.classList.toggle('active', n === cur);
  }
}

let lastStage = '', lastBadge = '';
function syncStage(){
  const S = STEPS[cur-1];
  let label = S.stages[S.stages.length-1][1];
  for (const st of S.stages){ if (tt <= st[0] + 1e-9){ label = st[1]; break; } }
  if (label !== lastStage){
    lastStage = label;
    el.stage.innerHTML = '<b>' + String(S.n).padStart(2,'0') + '</b> &nbsp;' + TR(label);
  }
  for (let i=0;i<rows.length;i++){
    const fill = i+1 < cur ? 100 : i+1 === cur ? tt*100 : 0;
    rows[i].stem.style.setProperty('--fill', fill.toFixed(1)+'%');
  }
  const wafer = viewFit > 2e6;
  const badges = [TR('drag to orbit'), TR('scroll to zoom in/out')];
  const bstr = badges.join('|') + wafer;
  if (bstr !== lastBadge){
    lastBadge = bstr;
    el.badge.innerHTML = badges.map(b => '<span>'+b+'</span>').join('');
    el.zoomchip.textContent = TR(wafer ? 'wafer view' : 'device view');
  }
  const pp = TR(playing ? '❚❚ Pause' : '▶ Play');
  if (ppBtn.textContent !== pp) ppBtn.textContent = pp;
  hereBtn.disabled = cur >= STEPS_SHOWN;   // nothing comes after the last step
}

function jump(n){ cur = n; tt = 1; playing = false; playAll = false; autoAzim = null; syncPanel(); }
function play(n){ cur = n; tt = 0; playing = true; syncPanel(); }

document.getElementById('playall').addEventListener('click', () => {
  playAll = true; play(1);
});
const hereBtn = document.getElementById('playhere');
hereBtn.addEventListener('click', () => {
  // "here" is the state on screen, which is the end of `cur` — so carry on with
  // the step that comes after it rather than replaying the one already done
  if (cur >= STEPS_SHOWN) return;
  playAll = true; play(cur + 1);
});
const ppBtn = document.getElementById('playpause');
ppBtn.addEventListener('click', () => {
  if (playing) playing = false;
  else { if (tt >= 1) tt = 0; playing = true; }
  syncPanel();
});
const speedBtn = document.getElementById('speed');
speedBtn.addEventListener('click', () => {
  speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1;
  speedBtn.textContent = speed.toFixed(1) + '×';
});
const langBtn = document.getElementById('langbtn');
langBtn.hidden = HOST.embed;         // embedded: the portal's toggle is the only one
langBtn.addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('themebtn').addEventListener('click', () => {
  const r = document.documentElement;
  const dark = r.dataset.theme
    ? r.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  themeDirty();
});
// #xsec and #resetview are wired in section 11; nothing more to bind here.

/* ---------------------------------------------------------------------------
 * 15.  Loop
 * ------------------------------------------------------------------------ */
window.addEventListener('keydown', e => {
  if (e.key === ' '){ e.preventDefault(); ppBtn.click(); }
  else if (e.key === 'ArrowRight') jump(Math.min(STEPS_SHOWN, cur+1));
  else if (e.key === 'ArrowLeft')  jump(Math.max(1, cur-1));
});

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (playing){
    tt += dt * speed / STEPS[cur-1].dur;
    if (tt >= 1){
      tt = 1;
      if (playAll && cur < STEPS_SHOWN){ cur += 1; tt = 0; syncPanel(); }
      else { playing = false; playAll = false; }
    }
  }
  autoAzim = null;
  scene(cur, tt);
  drawHUD(cur, tt);
  syncStage();
  requestAnimationFrame(frame);
}

resize();
applyLang();          // builds the rail, the epi table and the dossier — step 1 at t=0
requestAnimationFrame(frame);
</script>
</body>
