<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InP HBT QAD Process Flow</title>
<style>
/* ============================================================================
   Tokens.  Indigo-biased neutrals (the substrate's own hue), one accent taken
   from the emitter metal.  Material colours live only inside the viewport.
   ========================================================================== */
:root{
  --ink:#f2f3f7; --panel:#ffffff; --panel-2:#eaecf3;
  --rule:#d5d9e6; --rule-2:#e7eaf1;
  --text:#151a2b; --text-2:#4a5268; --muted:#727b93;
  --accent:#a8700c; --accent-soft:#f4e3bf;
  --viewport:#e8eaf1;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",monospace;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#0b0e18; --panel:#141829; --panel-2:#1b2135;
    --rule:#282f49; --rule-2:#1e2439;
    --text:#dfe3f0; --text-2:#aab2c8; --muted:#7c85a0;
    --accent:#f0b429; --accent-soft:#3a2f14;
    --viewport:#080a12;
  }
}
:root[data-theme="light"]{
  --ink:#f2f3f7; --panel:#ffffff; --panel-2:#eaecf3;
  --rule:#d5d9e6; --rule-2:#e7eaf1;
  --text:#151a2b; --text-2:#4a5268; --muted:#727b93;
  --accent:#a8700c; --accent-soft:#f4e3bf;
  --viewport:#e8eaf1;
}
:root[data-theme="dark"]{
  --ink:#0b0e18; --panel:#141829; --panel-2:#1b2135;
  --rule:#282f49; --rule-2:#1e2439;
  --text:#dfe3f0; --text-2:#aab2c8; --muted:#7c85a0;
  --accent:#f0b429; --accent-soft:#3a2f14;
  --viewport:#080a12;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--text);
  font-family:var(--sans); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---- shell --------------------------------------------------------------- */
.app{
  display:grid; height:100vh; min-height:560px;
  grid-template-columns:250px minmax(0,1fr) 310px;
  grid-template-rows:auto minmax(0,1fr);
  gap:0;
}
.masthead{
  grid-column:1/-1; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  padding:12px 18px; border-bottom:1px solid var(--rule); background:var(--panel);
}
.masthead h1{
  margin:0; font-size:15px; font-weight:650; letter-spacing:.055em;
  text-transform:uppercase;
}
.masthead .sub{color:var(--muted); font-size:12.5px}
.masthead .spacer{flex:1}
.chip{
  font-family:var(--mono); font-size:11px; letter-spacing:.04em;
  color:var(--text-2); border:1px solid var(--rule); border-radius:2px;
  padding:2px 7px; background:var(--panel-2);
}

/* ---- left rail ----------------------------------------------------------- */
.rail{
  border-right:1px solid var(--rule); background:var(--panel);
  overflow-y:auto; padding:14px 0 22px;
}
.railnote{
  margin:16px 16px 0; padding-top:12px; border-top:1px solid var(--rule);
  font-size:11.5px; color:var(--muted); line-height:1.45;
}
.rail h2{
  margin:0 0 10px; padding:0 16px; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); font-weight:650;
}
.flow{list-style:none;margin:0;padding:0 10px 0 16px}
.frow{display:grid;grid-template-columns:20px 1fr;align-items:center;position:relative}
.frow.seg{height:30px}
.frow.dot{min-height:32px}

.frow>.hit{
  position:absolute; inset:0 0 0 -6px; border-radius:4px; cursor:pointer;
  background:none; border:0; z-index:2;
}
.frow>.hit:hover~.gfx .stem{background:var(--accent);opacity:.55}
.frow>.hit:hover~.txt{color:var(--text)}
.gfx{display:flex;justify-content:center;align-items:center;height:100%;position:relative}
.seg .stem{
  width:2px; height:100%; background:var(--rule); position:relative; border-radius:1px;
}
.seg .stem::after{
  content:""; position:absolute; left:0; top:0; width:100%; height:var(--fill,0%);
  background:var(--accent); border-radius:1px;
}
.seg .txt{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.03em;
  color:var(--muted); padding-left:10px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}
.dot .mark{
  width:15px;height:15px;border-radius:50%; border:2px solid var(--rule);
  background:var(--panel); font-family:var(--mono); font-size:9px;
  display:flex;align-items:center;justify-content:center; color:transparent;
  transition:background .18s, border-color .18s;
}
.dot .txt{
  padding-left:10px; font-size:13px; color:var(--text-2); font-weight:500;
}
.dot .txt .num{
  font-family:var(--mono); font-size:10.5px; color:var(--muted);
  margin-right:7px; font-variant-numeric:tabular-nums;
}
.frow.done .mark{background:var(--rule);border-color:var(--rule)}
.frow.done.seg .stem{background:var(--rule)}
.frow.done .stem::after{height:100%}
.frow.here .mark{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.frow.here .txt{color:var(--text);font-weight:650}
.frow.active .stem::after{background:var(--accent)}

/* ---- viewport ------------------------------------------------------------ */
.stage{display:flex;flex-direction:column;min-width:0;background:var(--viewport)}
.view{position:relative;flex:1;min-height:0}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
.badge{
  position:absolute; left:14px; top:12px; z-index:3; display:flex; gap:6px; flex-wrap:wrap;
  pointer-events:none;
}
.badge span{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
  background:var(--panel); border:1px solid var(--rule); color:var(--text-2);
  padding:2px 7px;border-radius:2px;
}
.caption{
  border-top:1px solid var(--rule); background:var(--panel);
  padding:9px 16px; display:flex; align-items:center; gap:14px; min-height:42px;
}
.caption .stagetxt{
  font-family:var(--mono); font-size:12px; color:var(--text-2);
  flex:1; min-width:0;
}
.caption .stagetxt b{color:var(--accent);font-weight:600}
.transport{
  display:flex;gap:6px;align-items:center;border-top:1px solid var(--rule);
  background:var(--panel-2); padding:8px 16px; flex-wrap:wrap;
}
.btn{
  border:1px solid var(--rule); background:var(--panel); color:var(--text-2);
  padding:5px 11px; border-radius:3px; font-size:12px; letter-spacing:.02em;
  display:inline-flex;align-items:center;gap:6px; white-space:nowrap;
}
.btn[hidden]{display:none}
.btn:hover{color:var(--text);border-color:var(--muted)}
.btn:disabled{opacity:.34}
.btn:disabled:hover{color:var(--text-2);border-color:var(--rule)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
.btn.primary:hover{color:var(--ink);filter:brightness(1.08)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn kbd{font-family:var(--mono);font-size:10px;opacity:.65}

/* ---- right dossier ------------------------------------------------------- */
.info{
  border-left:1px solid var(--rule); background:var(--panel);
  overflow-y:auto; padding:16px 18px 28px;
}
.info .eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted);
}
.info h3{margin:4px 0 8px;font-size:19px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.info p{margin:0 0 14px;color:var(--text-2);font-size:13.2px;max-width:62ch}
.facts{
  border-top:1px solid var(--rule); margin:0 0 18px; padding-top:10px;
  display:grid; gap:6px;
}
.facts div{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{
  margin:0;font-family:var(--mono);font-size:11.5px;color:var(--text);
  font-variant-numeric:tabular-nums;text-align:right;
}
.info h4{
  margin:18px 0 8px; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); font-weight:650;
}
.stack{width:100%;border-collapse:collapse;font-size:11px;font-family:var(--mono);table-layout:auto}
.stack th{
  text-align:left;font-weight:600;color:var(--muted);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;padding:0 0 5px;border-bottom:1px solid var(--rule);
}
.stack th.r,.stack td.r{text-align:right;padding-left:6px}
.stack td{padding:2.5px 0;border-bottom:1px solid var(--rule-2);
  font-variant-numeric:tabular-nums;color:var(--text-2)}
.stack td.nm{color:var(--text)}
.stack th:first-child,.stack td:first-child{padding-right:9px}
.stack .nchip{
  display:inline-block;min-width:14px;padding:1px 3px;border-radius:2px;
  text-align:center;font-weight:700;font-size:10px;line-height:1.4;
  border:1px solid rgba(128,128,128,.3);
}
.stack tr.gone td{opacity:.34}
.note{font-size:11.5px;color:var(--muted);margin-top:12px;max-width:60ch}

@media (max-width:1120px){
  .app{grid-template-columns:210px minmax(0,1fr) 260px}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr; grid-template-rows:auto auto minmax(320px,58vh) auto; height:auto}
  .rail{border-right:0;border-bottom:1px solid var(--rule);max-height:210px}
  .info{border-left:0;border-top:1px solid var(--rule)}
  .stage{min-height:60vh}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="app">
  <header class="masthead">
    <h1 data-i18n>InP HBT QAD Process Flow</h1>
    <span class="sub" data-i18n>Interactive process flow</span>
    <span class="spacer"></span>
    <span class="chip" id="zoomchip">device view</span>
    <button class="btn" id="langbtn" data-i18n-title title="Switch language">中文</button>
    <button class="btn" id="themebtn" data-i18n data-i18n-title title="Toggle light / dark">◐ Theme</button>
  </header>

  <nav class="rail" data-i18n-aria aria-label="Process steps">
    <h2 data-i18n>Sequence</h2>
    <ol class="flow" id="flow"></ol>
    <p class="railnote" id="railnote"></p>
  </nav>

  <main class="stage">
    <div class="view" id="view">
      <canvas id="gl"></canvas>
      <canvas id="hud"></canvas>
      <div class="badge" id="badge"></div>
    </div>
    <div class="caption">
      <div class="stagetxt" id="stagetxt"></div>
    </div>
    <div class="transport">
      <button class="btn primary" id="playall" data-i18n>▶ From start</button>
      <button class="btn" id="playhere" data-i18n>▶ From here</button>
      <button class="btn" id="playpause">▶ Play</button>
      <span style="flex:1"></span>
      <button class="btn" id="xsec" data-i18n>Cross-section</button>
      <button class="btn" id="speed">1.0×</button>
      <button class="btn" id="resetview" data-i18n>Reset view</button>
    </div>
  </main>

  <aside class="info">
    <div class="eyebrow" id="i-eyebrow">Step 1 of 7</div>
    <h3 id="i-title">Wafer cut</h3>
    <p id="i-body"></p>
    <dl class="facts" id="i-facts"></dl>
    <h4 data-i18n>Epitaxial stack</h4>
    <table class="stack" id="i-stack">
      <thead><tr><th>#</th><th data-i18n>Layer</th><th class="r">nm</th><th class="r" data-i18n>type</th></tr></thead>
      <tbody></tbody>
    </table>
  </aside>
</div>

<script>
"use strict";
/* ===========================================================================
 * InP HBT QAD process flow — interactive 3-D illustration.
 *
 * A "quick and dirty" variant of the formal e-beam InP HBT flow (see
 * inp_hbt_process_flow.html): the same 12-layer epitaxy, but every mask is
 * printed by MA6 contact UV lithography and every device feature — the
 * emitter mesa, the base-collector mesa, the emitter/collector/base metals,
 * the six probe pads, the isolation island — is a plain rectangle or a
 * rectilinear U.  That means the whole scene is built from axis-aligned
 * box()/slab() frustums; the polygon triangulator, stripe/point geometry and
 * e-beam write machinery the formal flow needed for its tapered stripe and
 * ring shapes are not needed here at all, so this file does not carry them.
 *
 * Rendering is the same small hand-written WebGL pipeline as the formal
 * flow: every frame the scene is re-emitted as world-space triangles into
 * one vertex array, split into opaque / alpha-blended / additive chunks,
 * uploaded once and drawn.
 *
 * Units: nanometres, at device scale.  x = across, z = along, y = up, +y
 * from SUBTOP = 0.  Same wafer, same die, same crystal frame as the formal
 * flow — this is a different mask set on the same starting material.
 * ======================================================================== */

/* ---------------------------------------------------------------------------
 * 0.  Language
 *
 * English is the source of truth: every string is written in English where
 * it belongs and passed through TR() on its way to the DOM or the HUD.  ZH
 * holds only the strings that have a Traditional-Chinese form, so anything
 * missing falls straight through.  Many chemistry / wafer / epitaxy strings
 * below are written to match the formal flow's English exactly, so they pick
 * up its ZH translations for free.
 * ------------------------------------------------------------------------ */

let LANG = (function(){
  if (HOST.lang) return HOST.lang === 'zh' ? 'zh' : 'en';
  try {
    const q = new URLSearchParams(location.search).get('lang');
    if (q) return q.toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
    const stored = localStorage.getItem('hbtflow.lang');
    if (stored === 'zh' || stored === 'en') return stored;
  } catch (e) { /* no query string, or storage blocked: English */ }
  return 'en';
})();

const MISSING = new Set();
function TR(s){
  if (LANG !== 'zh' || !s) return s;
  const v = ZH[s];
  if (typeof v !== 'string'){ MISSING.add(s); return s; }   // also blocks Object.prototype
  return v;
}
window.i18nMissing = () => Array.from(MISSING).sort();
/** Fill {name} placeholders after translation, so word order can move. */
const TRF = (s, m) => s.replace(/\{(\w+)\}/g, (all, k) => m[k]);

function setLang(v){
  LANG = v === 'zh' ? 'zh' : 'en';
  if (!HOST.embed){ try { localStorage.setItem('hbtflow.lang', LANG); } catch (e) {} }
  applyLang();
}

/** Re-translate the static markup.  The English in the file is the key. */
function applyStatic(){
  for (const n of document.querySelectorAll('[data-i18n]')){
    if (n.dataset.en === undefined) n.dataset.en = n.textContent;
    n.textContent = TR(n.dataset.en);
  }
  for (const n of document.querySelectorAll('[data-i18n-title]')){
    if (n.dataset.enTitle === undefined) n.dataset.enTitle = n.title;
    n.title = TR(n.dataset.enTitle);
  }
  for (const n of document.querySelectorAll('[data-i18n-aria]')){
    const a = n.getAttribute('aria-label');
    if (n.dataset.enAria === undefined) n.dataset.enAria = a;
    n.setAttribute('aria-label', TR(n.dataset.enAria));
  }
  document.title = TR('InP HBT QAD Process Flow');
}

/** Everything that holds text, rebuilt in the active language. */
function applyLang(){
  document.documentElement.lang = LANG === 'zh' ? 'zh-Hant-TW' : 'en';
  applyStatic();
  langBtn.textContent = LANG === 'zh' ? 'EN' : '中文';
  buildRail();
  railNote();
  fillStack();
  syncPanel();
  lastStage = ''; lastBadge = '';        // force the stage line and badges out
}

/* ---------------------------------------------------------------------------
 * 1.  Geometry constants
 *
 * A QAD (quick-and-dirty) variant of the same InP HBT epitaxy: every mask is
 * printed by MA6 contact UV, not e-beam, and every feature is a plain
 * rectangle or a rectilinear U — no stripes, no tapered points, no posts, no
 * airbridge.  That means every mesa and every metal is a slab() frustum or a
 * handful of non-overlapping box()es; the polygon/triangulation machinery
 * the formal flow needed for its pointed stripe and ring shapes is not
 * needed here at all.
 * ------------------------------------------------------------------------ */
const BX = 33000;            // half-width  (x) of the whole drawing field
const BZ = 41000;            // half-length (z) -- wide enough to clear the
                              // -z probe pad row, which now reaches z -37500
let CUTAWAY = false;         // true: keep z <= CUT_Z and expose the emitter profile
let CUT_Z = -3000;           // the cut lands through the emitter mesa centre
const zF = () => CUTAWAY ? CUT_Z : BZ;
/** Every footprint goes through here, so the cross-section is one switch. */
const fp = (x0, x1, z0, z1) => ({x0, x1, z0, z1: Math.min(z1, zF())});
const FP_FULL = () => fp(-BX, BX, -BZ, BZ);

const SUBTOP = 0;            // top of the S.I. substrate = origin of the epi
const SUBBOT = -700;         // how much substrate we bother to draw

// Wafer, true scale: 3 inch = 76 mm diameter = 3.81e7 nm radius.  Identical
// to the formal flow — same boule, same cut, same die.
const WR   = 38.1e6;
const WTH  = 1.75e6;
const WPRI = 36.4775e6;
const WSEC = 37.7009e6;
const DIE  = 12e6;
const WGRID = 20000;

// --- E-mesa (emitter mesa), litho step 2: 5 x 12 um^2 ---------------------
const EMESA = {x0:-2500, x1:2500, z0:-9000, z1:3000};

// --- BC mesa (base-collector mesa), litho step 3: 19 x 20 um^2 ------------
const BCMESA = {x0:-9500, x1:9500, z0:-10000, z1:10000};

// --- EM, emitter metal on the E-mesa top: 3 x 10 um^2 ---------------------
const EM_R = {x0:-1500, x1:1500, z0:-8000, z1:2000};

// --- CM, U-shaped collector metal on the L3 sub-collector: 5 um arms ------
// inner edge 1 um outside the BC mesa on all three sides; opens toward +z,
// toward the port-2 pad.  Built as three non-overlapping rectangles (the
// two arms, full length, plus the crossbar filling the gap between them) so
// no two opaque fills ever land on the same plane.
const CM_ARM_L = {x0:-15500, x1:-10500, z0:-16000, z1:11000};
const CM_ARM_R = {x0: 10500, x1: 15500, z0:-16000, z1:11000};
const CM_BAR   = {x0:-10500, x1: 10500, z0:-16000, z1:-11000};
const CM_PARTS = [CM_ARM_L, CM_ARM_R, CM_BAR];

// --- BM, U-shaped base metal on the exposed GaAsSb shelf: 5 um arms -------
// 1 um gap from the E-mesa on the inside, 1 um inside the BC mesa edge on
// the outside; opens toward -z, toward the port-1 pad.
const BM_ARM_L = {x0:-8500, x1:-3500, z0:-9000, z1:9000};
const BM_ARM_R = {x0: 3500, x1: 8500, z0:-9000, z1:9000};
const BM_BAR   = {x0:-8500, x1: 8500, z0: 4000, z1: 9000};
const BM_PARTS = [BM_ARM_L, BM_ARM_R, BM_BAR];

// --- Probe pads: 10 x 15 um^2, six of them, laid out for a GSG launch on
// the sub-collector.  Deposited in the same run as EM + CM.  ISO is
// asymmetric in z (the collector U's crossbar runs to z -16000, the base
// side only to +11000), so the two pad rows sit at different distances from
// centre -- 25000 and -30000 -- chosen so each row clears ISO by the same
// 5500 nm (+z: 17500 - 12000; -z: -17000 - (-22500)).
const PAD_HX = 5000, PAD_HZ = 7500;
const PAD_XC = [-26000, 0, 26000], PAD_ZC = [25000, -30000];
const PADS = [];
for (const zc of PAD_ZC) for (const xc of PAD_XC)
  PADS.push({x0:xc-PAD_HX, x1:xc+PAD_HX, z0:zc-PAD_HZ, z1:zc+PAD_HZ,
             role: zc>0 ? (xc===0?'B':'G') : (xc===0?'C':'G')});

// --- Vias through the cured BCB, litho step 8: nine plain rectangles, each
// sized off the metal rectangle it must land on so it cannot drift out from
// under it.  `land` tags which metal group drawBCB()'s viaFloorY() should
// bottom it out on.
const EM_VIA = {x0:EM_R.x0+750, x1:EM_R.x1-750, z0:EM_R.z0+1000, z1:EM_R.z1-1000,
                land:'EM', id:'EM via'};                       // 1.5 x 8 um^2, centred on EM_R
const BM_VIA = {x0:-4000, x1:4000, z0:BM_BAR.z0+1000, z1:BM_BAR.z1-1000,
                land:'BM', id:'BM via'};                        // 8 x 3 um^2, on the base crossbar
const CM_VIA = {x0:-4000, x1:4000, z0:CM_BAR.z0+1000, z1:CM_BAR.z1-1000,
                land:'CM', id:'CM via'};                        // 8 x 3 um^2, on the collector crossbar
// One per probe pad, each pad's rectangle inset 1 um all round -- 8 x 13 um^2.
const PAD_VIAS = PADS.map(p => ({x0:p.x0+1000, x1:p.x1-1000, z0:p.z0+1000, z1:p.z1-1000,
                                  land:'PAD', id:'pad via', role:p.role}));
const VIAS = [EM_VIA, BM_VIA, CM_VIA, ...PAD_VIAS];

// --- Isolation island: the CM outline grown 1 um and squared off ----------
const ISO = {x0:-16500, x1:16500, z0:-17000, z1:12000};

// Undercut per side, worst at the layer boundary where HCl takes over — the
// same per-nanometre law as the formal flow, because it is the same epi and
// the same wet chemistry.  Anisotropy along/across the two <011> directions
// is not modelled here: every QAD mesa is a plain rectangle, so a single
// isotropic inset per side is close enough to be a fair illustration without
// pretending to know which crystal facet keys off which mask edge.
const UC_MAX = 60;           // emitter mesa: worst-case undercut, at the AlInP
const BC_UC  = 90;           // base–collector mesa: HCl undercut into the InP
const ISO_UC = 110;          // isolation: HCl undercut through the L2 InP

// Metal thicknesses.  Set once, used everywhere metal is drawn; never quoted
// in the on-screen text, because the process spec does not give a number.
const EM_H = 250, CM_H = 250, BM_H = 250, M1_H = 1000;
const SINK = 3;               // a film starts this far inside what it sits on,
                               // so its underside is never coplanar with it
const BI_UC = 250;            // lift-off: how much wider the bottom resist
                               // layer clears than the top, per side

// Dielectric.  BCB goes on as a liquid that wets the topography and the slow
// cure ramp reflows it flat, exactly as in the formal flow's step 8 — just a
// shallower stack, because nothing here reaches the formal flow's emitter
// post height.
const BCB_CONF = 800;        // thickness of the liquid where it sits, as spun
const BCB_TOP  = 1350;       // planar top after the cure

// --- M1, thick gold pad metal on the via-opened BCB: five rectangles, each
// derived off the pad/metal anchors above so nothing drifts.  Two side
// plates plus the bridge between them form one connected ground conductor
// that lands on the emitter via; the two signal fingers run from the base
// and collector pads down onto their own via -- one probe row per port, and
// every via lands under exactly one M1 rectangle, unlike the formal flow's
// via-free etch-back launch.
const M1_GND_L  = {x0: PAD_XC[0]-PAD_HX, x1: PAD_XC[0]+PAD_HX,
                    z0: PAD_ZC[1]-PAD_HZ, z1: PAD_ZC[0]+PAD_HZ};
const M1_GND_R  = {x0: PAD_XC[2]-PAD_HX, x1: PAD_XC[2]+PAD_HX,
                    z0: PAD_ZC[1]-PAD_HZ, z1: PAD_ZC[0]+PAD_HZ};
const M1_BRIDGE = {x0: M1_GND_L.x1, x1: M1_GND_R.x0, z0: EM_R.z0, z1: EM_R.z1};
const M1_SIG_B  = {x0: PAD_XC[1]-PAD_HX, x1: PAD_XC[1]+PAD_HX,
                    z0: BM_BAR.z0, z1: PAD_ZC[0]+PAD_HZ};          // port 1, base
const M1_SIG_C  = {x0: PAD_XC[1]-PAD_HX, x1: PAD_XC[1]+PAD_HX,
                    z0: PAD_ZC[1]-PAD_HZ, z1: CM_BAR.z1};          // port 2, collector
const M1_PARTS  = [M1_GND_L, M1_GND_R, M1_BRIDGE, M1_SIG_B, M1_SIG_C];

/* The scene axes, in the crystal frame — the same (100) InP, the same two
 * <011> flats, as the formal flow. */
const AXES = [
  {v:[1,0,0], lab:'[01̅1]', note:'along the primary flat'},
  {v:[0,1,0], lab:'[100]',        note:'growth · surface normal'},
  {v:[0,0,1], lab:'[011]',        note:'out of the primary flat'},
];

/* ---------------------------------------------------------------------------
 * 2.  Epitaxy.  Identical to the formal flow: same 12 layers, same
 * thicknesses (Å from the grower's sheet, kept in nm here), same colours,
 * same 747.5 nm total.  This is the same starting wafer; only the masks
 * differ downstream.
 * ------------------------------------------------------------------------ */
const C = {
  sub:     '#2b2f4e',
  igaas_i: '#86d9d2',
  inp_np:  '#5a6bd0',
  igaas:   '#23a89c',
  inp_n:   '#8b97e0',
  gaassb:  '#e88b3c',
  alinp:   '#a874e0',
  igaas_g: '#37c49b',
  metal:   '#e6c25c',        // every metal in this flow is gold
  r1:      '#6fae7a',
  r2:      '#7fa6de',
  r3:      '#cf9ede',
  rThick:  '#7fb27a',
  rExp:    '#ffd97a',
  rGen:    '#7fa6de',
  bcb:     '#c39257',
  bcbCure: '#8d6238',
  beam:    '#9ad9ff',
  uv:      '#a855f7',       // the exposure wavelength, near enough
  etchant: '#2f7fe0',       // wet chemistry, as a running film
  chrome:  '#20243a',
  flux:    '#ffe9a8',
  plasma:  '#8effd8',
  wafer:   '#464d75',
  scribe:  '#9aa6cc',
};

// bottom -> top
const EPI = [
  {i:1,  name:'Etch stop',     mat:'In₀.₅₃Ga₀.₄₇As', A:100,  type:'i',  col:C.igaas_i, grp:'sc'},
  {i:2,  name:'Sub-collector', mat:'InP',             A:3500, type:'N+', col:C.inp_np,  grp:'sc'},
  {i:3,  name:'Sub-collector', mat:'In₀.₅₃Ga₀.₄₇As', A:350,  type:'N+', col:C.igaas,   grp:'sc'},
  {i:4,  name:'Sub-collector', mat:'InP',             A:500,  type:'N+', col:C.inp_np,  grp:'bc'},
  {i:5,  name:'Collector',     mat:'InP',             A:1200, type:'N',  col:C.inp_n,   grp:'bc'},
  {i:6,  name:'Base',          mat:'GaAs₀.₅Sb₀.₅',   A:200,  type:'P+', col:C.gaassb,  grp:'bc'},
  {i:7,  name:'Emitter',       mat:'Al₀.₁→₀InP',     A:175,  type:'N-', col:C.alinp,   grp:'em'},
  {i:8,  name:'Emitter',       mat:'InP',             A:200,  type:'N',  col:C.inp_n,   grp:'em'},
  {i:9,  name:'Emitter',       mat:'InP',             A:100,  type:'N',  col:C.inp_n,   grp:'em'},
  {i:10, name:'Emitter',       mat:'InP',             A:700,  type:'N+', col:C.inp_np,  grp:'em'},
  {i:11, name:'Emitter cap',   mat:'In₀.₅₃Ga₀.₄₇As', A:100,  type:'N+', col:C.igaas,   grp:'em'},
  {i:12, name:'Emitter cap',   mat:'InₓGa₁₋ₓAs 0.53→1', A:350, type:'N+', col:C.igaas, grp:'em'},
];
(function stackUp(){
  let y = SUBTOP;
  for (const L of EPI){ L.t = L.A/10; L.y0 = y; y += L.t; L.y1 = y; }
})();
const EPI_TOP    = EPI[EPI.length-1].y1;              // 747.5 nm
const Y_BASE_TOP = EPI.find(l=>l.i===6).y1;           // 585   — emitter etch stop
const Y_SC_TOP   = EPI.find(l=>l.i===3).y1;           // 395   — B–C etch stops on the InGaAs
const Y_INP_TOP  = EPI.find(l=>l.i===10).y1;          // 702.5 — where HCl takes over
const Y_BC_INP   = EPI.find(l=>l.i===6).y0;           // 565   — where HCl takes over again

/* ---------------------------------------------------------------------------
 * 3.  Maths helpers

  for (let j=0;j<nz-1;j++) for (let i=0;i<nx-1;i++){
    const x0=X(i), x1=X(i+1), z0=Z(j), z1=Z(j+1);
    quad([x0,T(i,j),z0],[x1,T(i+1,j),z0],[x1,T(i+1,j+1),z1],[x0,T(i,j+1),z1], c, alpha);
  }
  for (let i=0;i<nx-1;i++){
    const x0=X(i), x1=X(i+1);
    quad([x0,H(i,0),r.z0],[x1,H(i+1,0),r.z0],[x1,T(i+1,0),r.z0],[x0,T(i,0),r.z0], c, alpha);
    quad([x0,H(i,nz-1),r.z1],[x1,H(i+1,nz-1),r.z1],[x1,T(i+1,nz-1),r.z1],[x0,T(i,nz-1),r.z1], c, alpha);
  }
  for (let j=0;j<nz-1;j++){
    const z0=Z(j), z1=Z(j+1);
    quad([r.x0,H(0,j),z0],[r.x0,H(0,j+1),z1],[r.x0,T(0,j+1),z1],[r.x0,T(0,j),z0], c, alpha);
    quad([r.x1,H(nx-1,j),z0],[r.x1,H(nx-1,j+1),z1],[r.x1,T(nx-1,j+1),z1],[r.x1,T(nx-1,j),z0], c, alpha);
  }
  end();
  if (o.edges){
    const ec = EDGE, ea = o.edgeA===undefined?EDGE_A:o.edgeA;
    for (let i=0;i<nx-1;i++){
      line([X(i),T(i,0),r.z0],[X(i+1),T(i+1,0),r.z0], ec, ea);
      line([X(i),T(i,nz-1),r.z1],[X(i+1),T(i+1,nz-1),r.z1], ec, ea);
    }
  }
}

/* --- topography: what is on top at (x,z), given a fixed prior device state.
 * Resist and BCB always coat right at the start of a step, before that
 * step's own etch or deposition changes anything, so one snapshot of the
 * previous step's end state is all a coat ever needs to drape over. -------*/
function inR(r,x,z){ return x>=r.x0 && x<=r.x1 && z>=r.z0 && z<=r.z1; }
function inCM(x,z){ return inR(CM_ARM_L,x,z)||inR(CM_ARM_R,x,z)||inR(CM_BAR,x,z); }
function inBM(x,z){ return inR(BM_ARM_L,x,z)||inR(BM_ARM_R,x,z)||inR(BM_BAR,x,z); }
function inPad(x,z){ for (const p of PADS) if (inR(p,x,z)) return true; return false; }
function inIso(x,z){ return inR(ISO,x,z) || inPad(x,z); }

function topoHeight(x, z, P0){
  const emDone = P0.emUC >= 1, bcDone = P0.bcUC >= 1, isoDone = P0.isoUC >= 1;
  let h;
  if (inR(EMESA,x,z)){
    h = EPI_TOP + (P0.emH||0);
  } else if (inR(BCMESA,x,z)){
    h = (emDone ? Y_BASE_TOP : EPI_TOP) + (P0.bmH||0);
  } else {
    h = bcDone ? Y_SC_TOP : (emDone ? Y_BASE_TOP : EPI_TOP);
    if (isoDone) h = inIso(x,z) ? Y_SC_TOP : SUBTOP;
    if (inCM(x,z) || inPad(x,z)) h += (P0.cmH||0);
  }
  return h;
}

/* ---------------------------------------------------------------------------
 * 7.  Device state
 *
 * One plain object describes everything the device can be part-way through.
 * buildScene() fills it from the step index and the step's own time, and
 * drawDevice() reads it and nothing else — so a frozen end-of-step state and
 * a mid-animation state go down the same path.
 *
 *   emEtchY   nm   top of the field outside the E-mesa: EPI_TOP -> Y_BASE_TOP
 *   emUC      0..1 how far the HCl has undercut the E-mesa (>=1 means done)
 *   bcEtchY   nm   top of the field outside the BC mesa: Y_BASE_TOP -> Y_SC_TOP
 *   bcUC      0..1 undercut of the BC mesa
 *   emH       nm   emitter metal grown on the E-mesa top          (0 -> EM_H)
 *   cmH       nm   collector metal + the six probe pads           (0 -> CM_H)
 *   bmH       nm   base metal on the exposed GaAsSb shelf         (0 -> BM_H)
 *   isoEtchY  nm   top of the field outside the iso island: Y_SC_TOP -> SUBTOP
 *   isoUC     0..1 undercut through the L2 InP
 *   bcbTop    nm   top of the BCB film, 0 when there is none
 *   bcbConf   0..1 1 while the film still follows the topography, 0 once cured
 *   bcbCure   0..1 colour ramp from as-spun to crosslinked
 *   via       0..1 how far the CF₄/O₂ RIE has opened the nine BCB vias
 *                  (>=1 means all nine are open down to their metal)
 *   padH      nm   M1 pad metal on the via-opened BCB               (0 -> M1_H)
 *   resist    obj  this step's resist, or null   (see drawResist)
 *   fx        obj  this step's effect streaks, or null
 *   ghost     0..1 fade used only while the camera hands over from the die
 * ------------------------------------------------------------------------ */
function blankP(){
  return {
    emEtchY: EPI_TOP, emUC: 0,
    bcEtchY: Y_BASE_TOP, bcUC: 0,
    emH: 0, cmH: 0, bmH: 0,
    isoEtchY: Y_SC_TOP, isoUC: 0,
    bcbTop: 0, bcbConf: 0, bcbCure: 0, via: 0,
    padH: 0,
    resist: null, fx: null, ghost: 0,
  };
}
/** The settled state after step k — the state step k+1 starts from. */
function stepEndP(k){
  const P = blankP();
  if (k >= 2){ P.emEtchY = Y_BASE_TOP; P.emUC = 1; }
  if (k >= 3){ P.bcEtchY = Y_SC_TOP;   P.bcUC = 1; }
  if (k >= 4){ P.emH = EM_H; P.cmH = CM_H; }
  if (k >= 5){ P.bmH = BM_H; }
  if (k >= 6){ P.isoEtchY = SUBTOP; P.isoUC = 1; }
  if (k >= 7){ P.bcbTop = BCB_TOP; P.bcbCure = 1; P.bcbConf = 0; }
  if (k >= 8){ P.via = 1; }
  if (k >= 9){ P.padH = M1_H; }
  return P;
}

/* ---------------------------------------------------------------------------
 * 8.  Device geometry
 *
 * Every QAD mesa, metal run and resist block is an axis-aligned rectangle or
 * a small union of them, so the whole device comes out of slab()/box() and
 * the rectCells() partition from section 6 — no polygons anywhere.
 * ------------------------------------------------------------------------ */

/** Every static footprint (EMESA, BCMESA, a pad, ...) goes through fp() the
 *  same way FP_FULL() does, so CUTAWAY clips it too. */
const fpR = r => fp(r.x0, r.x1, r.z0, r.z1);

/** Linear undercut profile along one wet-etched band: 0 at its top (the
 *  citric interface above it), the full inset at its bottom.  Held flat past
 *  either end so a straight-walled citric layer inherits whichever edge of
 *  the band it sits against — same shape as the reference's isoInset() /
 *  emInset(), just parameterised so one function covers all three bands. */
function ucInset(y, yTop, yBot, ucMax, uc){
  if (!uc) return 0;
  return ucMax * uc * clamp01((yTop - y) / (yTop - yBot));
}

/** The isolation island: the ISO rectangle plus the six pads, each already
 *  its own island once the field around it is gone — inset by `a` a side. */
function isoRects(a){
  const out = [fpR(growRect(ISO, -a))];
  for (const p of PADS) out.push(fpR(growRect(p, -a)));
  return out;
}

/** Layers 1–3.  L3 (i:3, InGaAs) and L1 (i:1, the etch stop) are citric and
 *  etch straight; L2 (i:2, InP) is HCl and undercuts — so only L2's own
 *  bounds feed ucInset(), and the layers above/below it inherit whichever
 *  edge they sit against. */
function drawIsoLayer(L, P, alpha){
  const o = {edges:true, edgeA:0.34, a:alpha};
  const etchY = P.isoEtchY;
  if (etchY >= L.y1 - 1e-6){ box(FP_FULL(), L.y0, L.y1, L.col, o); return; }
  if (etchY > L.y0 + 1e-6) box(FP_FULL(), L.y0, etchY, L.col, o);
  const y0 = Math.max(L.y0, Math.min(etchY, L.y1));
  const L2 = EPI.find(l => l.i === 2);
  const a = ucInset(y0,   L2.y1, L2.y0, ISO_UC, P.isoUC);
  const b = ucInset(L.y1, L2.y1, L2.y0, ISO_UC, P.isoUC);
  const B = isoRects(a), T = isoRects(b);
  for (let k = 0; k < B.length; k++) slab(B[k], T[k], y0, L.y1, L.col, o);
}

/** Layers 4–6.  The base (i:6, GaAsSb) is citric and etches straight; the
 *  two InP layers below it (i:5, i:4) are HCl and undercut as one band. */
function drawBCLayer(L, P, alpha){
  const o = {edges:true, edgeA:0.34, a:alpha};
  const etchY = P.bcEtchY;
  if (etchY >= L.y1 - 1e-6){ box(FP_FULL(), L.y0, L.y1, L.col, o); return; }
  if (etchY > L.y0 + 1e-6) box(FP_FULL(), L.y0, etchY, L.col, o);
  const y0 = Math.max(L.y0, Math.min(etchY, L.y1));
  const a = ucInset(y0,   Y_BC_INP, Y_SC_TOP, BC_UC, P.bcUC);
  const b = ucInset(L.y1, Y_BC_INP, Y_SC_TOP, BC_UC, P.bcUC);
  slab(fpR(growRect(BCMESA, -a)), fpR(growRect(BCMESA, -b)), y0, L.y1, L.col, o);
}

/** Layers 7–12.  The two InGaAs caps (i:12, i:11) are citric and etch
 *  straight; the InP/AlInP below (i:10..i:7) are HCl and undercut as one
 *  band, worst at i:7 (the AlInP), which is why UC_MAX sits at its foot. */
function drawEmLayer(L, P, alpha){
  const o = {edges:true, edgeA:0.34, a:alpha};
  const etchY = P.emEtchY;
  if (etchY >= L.y1 - 1e-6){ box(FP_FULL(), L.y0, L.y1, L.col, o); return; }
  if (etchY > L.y0 + 1e-6) box(FP_FULL(), L.y0, etchY, L.col, o);
  const y0 = Math.max(L.y0, Math.min(etchY, L.y1));
  const a = ucInset(y0,   Y_INP_TOP, Y_BASE_TOP, UC_MAX, P.emUC);
  const b = ucInset(L.y1, Y_INP_TOP, Y_BASE_TOP, UC_MAX, P.emUC);
  slab(fpR(growRect(EMESA, -a)), fpR(growRect(EMESA, -b)), y0, L.y1, L.col, o);
}

/**
 * Draws the whole device for one state P: substrate and epitaxy, then
 * metals, then resist, then BCB, then process effects.  This function and
 * the three layer helpers above are the only code that reads P's *EtchY and
 * *UC fields; everything downstream just reads the slabs they leave behind.
 */
function drawDevice(P){
  const A = 1 - (P.ghost || 0);
  if (A <= 0.01) return;
  const o = {edges:true, edgeA:0.34, a:A};

  box(FP_FULL(), SUBBOT, SUBTOP, C.sub, o);
  for (const L of EPI){
    if (L.grp === 'sc')      drawIsoLayer(L, P, A);
    else if (L.grp === 'bc') drawBCLayer(L, P, A);
    else                     drawEmLayer(L, P, A);
  }

  // after the isolation etch, CM and the pads still sit at Y_SC_TOP — only
  // what is underneath them changed, so no special case is needed here
  const mo = {edges:true, edgeA:0.34, a:A};
  if (P.emH > 0) box(fpR(EM_R), EPI_TOP - SINK, EPI_TOP + P.emH, C.metal, mo);
  if (P.cmH > 0){
    for (const r of CM_PARTS) box(fpR(r), Y_SC_TOP - SINK, Y_SC_TOP + P.cmH, C.metal, mo);
    for (const p of PADS)     box(fpR(p), Y_SC_TOP - SINK, Y_SC_TOP + P.cmH, C.metal, mo);
  }
  if (P.bmH > 0)
    for (const r of BM_PARTS) box(fpR(r), Y_BASE_TOP - SINK, Y_BASE_TOP + P.bmH, C.metal, mo);
  if (P.padH > 0){
    // M1 is thicker than any via is deep (see the header's via-depth table),
    // so it does not planarise over one: it drapes, filling the hole solid
    // and carrying the dip in its own top surface out to the field, the same
    // conformal-shell treatment a resist or the BCB gets, just on an
    // adaptive grid -- a uniform one would either miss a via a few hundred
    // nm wide or explode chasing it across a footprint tens of microns long.
    // One shell per part also replaces the old separate via "plug": the
    // drape already carries the metal down into the hole and back out.
    for (const part of M1_PARTS){
      const r = fp(part.x0, part.x1, part.z0, part.z1);
      if (r.x1 - r.x0 <= 1 || r.z1 - r.z0 <= 1) continue;
      const vias = VIAS.filter(v => v.x0 >= part.x0 && v.x1 <= part.x1 &&
                                      v.z0 >= part.z0 && v.z1 <= part.z1);
      // inset SINK inside each via -- the same "start this far inside what
      // it sits on" margin every other metal uses -- so the dip's footprint
      // never shares a plane with drawBCB()'s own via hole walls.
      const ins = vias.map(v => growRect(v, -SINK));
      const xs = adaptiveLines(r.x0, r.x1, vias.flatMap(v => viaAxisPts(v.x0, v.x1)));
      const zs = adaptiveLines(r.z0, r.z1, vias.flatMap(v => viaAxisPts(v.z0, v.z1)));
      const hFn = (x, z) => {
        for (let i = 0; i < ins.length; i++){
          const iv = ins[i];
          if (x > iv.x0 && x < iv.x1 && z > iv.z0 && z < iv.z1) return viaFloorY(vias[i]);
        }
        return BCB_TOP;
      };
      drapedShell(part, hFn, P.padH, C.metal, mo.a, {mode:'opaque', xLines:xs, zLines:zs});
      // every via sits >= 1 um inside the part it lands under, so the rim
      // is flat -- the same wireframe box() would have drawn.
      if (mo.edges){
        const ec = mo.edgeCol ? hex(mo.edgeCol) : EDGE, ea = mo.edgeA===undefined?EDGE_A:mo.edgeA;
        const B=[[r.x0,BCB_TOP,r.z0],[r.x1,BCB_TOP,r.z0],[r.x1,BCB_TOP,r.z1],[r.x0,BCB_TOP,r.z1]];
        const T=[[r.x0,BCB_TOP+P.padH,r.z0],[r.x1,BCB_TOP+P.padH,r.z0],
                 [r.x1,BCB_TOP+P.padH,r.z1],[r.x0,BCB_TOP+P.padH,r.z1]];
        for (let i=0;i<4;i++){
          const j=(i+1)%4;
          line(B[i],B[j],ec,ea); line(T[i],T[j],ec,ea); line(B[i],T[i],ec,ea);
        }
      }
    }
  }

  drawResist(P);
  drawBCB(P);
  drawFx(P);
}

/* ---------------------------------------------------------------------------
 * Resist.  P.resist is one of:
 *
 *   {kind:'single', y0, thk, coat, latent, dev, fade, keep, holes, flat}
 *     One photoresist layer (steps 2, 3, 6, 8): y0 the surface it is spun on,
 *     thk its nominal thickness, coat 0..1 the spin-on progress, latent
 *     0..1 how strongly the exposed field is tinted C.rExp before develop,
 *     dev 0..1 develop progress (1 = field gone, only the mask islands
 *     remain), fade 0..1 the strip, keep an array of rectangles the mask
 *     protects (steps 2/3/6: a single island) OR holes an array of
 *     apertures cut from the whole field (step 8: the nine vias) — the
 *     two are mutually exclusive, holes goes through hollowSlab().  flat
 *     true skips the topography drape while coating (step 8 only: the
 *     cured BCB it spins onto is already planar).  Colour C.rThick.
 *
 *   {kind:'bi', y0, t1, t2, grow1, grow2, devT, devB, open, over, fade, lift, flat}
 *     The two-layer lift-off stack (steps 4, 5, 9): y0 the surface it is
 *     spun on, t1/t2 the bottom/top layer thickness, grow1/grow2 0..1 the
 *     two spins, devT 0..1 the top layer developing to `open`, devB 0..1 the
 *     DUV flood clearing the bottom layer wider (open grown by BI_UC per
 *     side), over the metal overburden thickness once evaporation runs,
 *     fade 0..1 the strip, lift the nm the whole stack rises on lift-off.
 *     flat true skips the topography drape while coating (step 9 only: it
 *     spins onto the already-planar cured, via-opened BCB) -- same
 *     convention as kind:'single'.  Bottom layer C.r1, top layer C.r2.
 *
 *   {kind:'bcb', ...}  not drawn here — see drawBCB().
 *
 * Everything here is semi-transparent (alpha ~0.62 while present, times
 * `fade`), so it all goes down the 'blend' path.
 * ------------------------------------------------------------------------ */
function drawResist(P){
  const R = P.resist;
  if (!R) return;
  const A = 1 - (P.ghost || 0);
  const fade = R.fade === undefined ? 1 : R.fade;
  if (A <= 0.01 || fade <= 0.003) return;
  const a = 0.62 * fade * A;

  if (R.kind === 'single'){
    const fieldCol = mixCol(C.rThick, C.rExp, clamp01(R.latent || 0));
    if (R.coat < 1 || R.dev < 1){
      const thk = R.thk * clamp01(R.coat);
      if (R.flat) box(FP_FULL(), R.y0, R.y0 + thk, fieldCol, {a, edges:true});
      else drapedShell(FP_FULL(), (x,z) => topoHeight(x,z,P), thk, fieldCol, a, {edges:true});
    } else if (R.holes){
      hollowSlab(FP_FULL(), R.holes, R.y0, R.y0 + R.thk, C.rThick, {a, edges:true});
    } else {
      for (const r of R.keep) box(fpR(r), R.y0, R.y0 + R.thk, C.rThick, {a, edges:true});
    }

  } else if (R.kind === 'bi'){
    const y0 = R.y0, t1 = R.t1, t2 = R.t2, lift = R.lift || 0;
    if (R.grow1 < 1 || R.grow2 < 1){
      const h1 = t1 * clamp01(R.grow1);
      if (R.flat){
        box(FP_FULL(), y0, y0 + h1, C.r1, {a, edges:true});
        if (R.grow2 > 0){
          const h2 = t2 * clamp01(R.grow2);
          box(FP_FULL(), y0 + h1, y0 + h1 + h2, C.r2, {a, edges:true});
        }
      } else {
        drapedShell(FP_FULL(), (x,z) => topoHeight(x,z,P), h1, C.r1, a, {edges:true});
        if (R.grow2 > 0){
          const h2 = t2 * clamp01(R.grow2);
          drapedShell(FP_FULL(), (x,z) => topoHeight(x,z,P) + h1, h2, C.r2, a, {edges:true});
        }
      }
    } else {
      // developed: the field minus the apertures — the bottom layer's own
      // aperture is the top layer's grown by BI_UC, which is what reads as
      // the lift-off undercut
      const devB = clamp01(R.devB || 0), devT = clamp01(R.devT || 0);
      const apB = R.open.map(r => scaleRect(growRect(r, BI_UC), devB));
      const apT = R.open.map(r => scaleRect(r, devT));
      const yy0 = y0 + lift, y1a = yy0 + t1, y1b = y1a + t2;
      hollowSlab(FP_FULL(), apB, yy0, y1a, C.r1, {a, edges:true});
      hollowSlab(FP_FULL(), apT, y1a, y1b, C.r2, {a, edges:true});
      if (R.over > 0)
        hollowSlab(FP_FULL(), apT, y1b, y1b + R.over, C.metal, {a: fade * A, edges:true});
    }
  }
}

/** Where a via bottoms out — the top of the metal underneath it, which the
 *  CF₄/O₂ RIE stops on. */
function viaFloorY(v){
  if (v.land === 'EM') return EPI_TOP + EM_H;
  if (v.land === 'BM') return Y_BASE_TOP + BM_H;
  return Y_SC_TOP + CM_H;                // the CM via and all six pad vias
}

/* ---------------------------------------------------------------------------
 * BCB.  Spun on as a liquid, it drapes over the topography; the slow cure
 * ramp then reflows it flat — the same story as the formal flow's step 8,
 * just a shallower stack, since nothing here reaches an emitter post.  Once
 * the RIE (step 8) starts opening vias, the cured slab is the field minus
 * the nine via rectangles, drawn with hollowSlab() as one continuous sheet.
 * ------------------------------------------------------------------------ */
function drawBCB(P){
  if (P.bcbTop <= 0) return;
  const A = 1 - (P.ghost || 0);
  if (A <= 0.01) return;
  const col = mixCol(C.bcb, C.bcbCure, clamp01(P.bcbCure));
  const aTot = 0.55 * A, conf = clamp01(P.bcbConf);
  if (conf > 0.002){
    const thk = lerp(P.bcbTop - SUBTOP, BCB_CONF, conf);
    drapedShell(FP_FULL(), (x,z) => topoHeight(x,z,P), thk, col, aTot * conf, {edges:true});
  }
  if (conf < 0.998){
    const a = aTot * (1 - conf), o = {a, edges:true};
    if (P.via > 0){
      hollowSlab(FP_FULL(), VIAS, SUBTOP, P.bcbTop, col, o);
      // mid-etch: a plug of the still-unetched BCB above each via's metal,
      // its top dropping from the cured plane toward the metal as P.via
      // goes 0 -> 1 -- so each hole visibly deepens rather than popping open
      for (const v of VIAS){
        const top = lerp(P.bcbTop, viaFloorY(v), P.via);
        box(fpR(v), SUBTOP, top, col, o);
      }
    } else {
      box(FP_FULL(), SUBTOP, P.bcbTop, col, o);
    }
  }
}

/* ---------------------------------------------------------------------------
 * Process effects.  P.fx is one of:
 *
 *   {kind:'uv',  y0, t, open}   MA6 flood exposure through a chrome mask
 *     plate floating at y0, its openings `open` cut out via hollowSlab();
 *     downward violet streaks fall only through those rectangles.  This
 *     flow never carries kind:'ebeam' — every mask here is MA6 contact UV.
 *   {kind:'duv', y0, t, open}   the DUV flood: the same falling streaks,
 *     but no plate — the developed top resist, already drawn, is its own
 *     mask, so the streaks fall everywhere and read against it.
 *   {kind:'flux', y0, t}        evaporation: warm streaks falling straight
 *     down onto the wafer.
 *   {kind:'wet', y, yTop, t}    the running wet-etch film: a thin
 *     translucent sheet at the current etch front `y`, plus streaks falling
 *     from `yTop`.
 * ------------------------------------------------------------------------ */
function drawFx(P){
  const F = P.fx;
  if (!F) return;
  const A = 1 - (P.ghost || 0);
  if (A <= 0.01) return;
  const sc = fxScale();

  if (F.kind === 'uv' || F.kind === 'duv'){
    if (F.kind === 'uv'){
      box(FP_FULL(), F.y0, F.y0 + 250, C.uv, {a: 0.16 * A, mode:'blend'});
      hollowSlab(FP_FULL(), F.open, F.y0 - 140, F.y0, C.chrome, {a: A, edges:true, edgeA:0.4});
    }
    for (let i = 0; i < 70; i++){
      const x = (rnd(i) * 2 - 1) * BX * 0.97;
      const z = -BZ + rnd(i + 90) * (zF() + BZ);
      if (F.kind === 'uv'){
        let open = false;
        for (const r of F.open) if (inR(r, x, z)) { open = true; break; }
        if (!open) continue;
      }
      const ph = (F.t * 1.6 + rnd(i + 400)) % 1;
      const yTop = lerp(F.y0, F.y0 - 900, ph);
      streak(x, yTop, yTop - 260 * sc, z, 46 * sc, C.uv, 0.30 * A);
    }

  } else if (F.kind === 'flux'){
    const hw = 95 * sc, len = 2300 * sc;
    for (let i = 0; i < 46; i++){
      const x = (rnd(i) * 2 - 1) * BX * 0.97;
      const z = -BZ + rnd(i + 90) * (zF() + BZ);
      const ph = (F.t * 1.7 + rnd(i + 400)) % 1;
      const yTop = lerp(F.y0 + 2400, F.y0 + 260, ph);
      streak(x, yTop, yTop - len, z, hw, C.flux, 0.40 * (1 - ph * 0.35) * A, 'blend');
    }

  } else if (F.kind === 'wet'){
    box(FP_FULL(), F.y - 40, F.y + 40, C.etchant, {a: 0.30 * A, mode:'blend'});
    for (let i = 0; i < 40; i++){
      const x = (rnd(i + 3) * 2 - 1) * BX * 0.97;
      const z = -BZ + rnd(i + 51) * (zF() + BZ);
      const ph = (F.t * 2.1 + rnd(i + 55)) % 1;
      const yTop = lerp(F.yTop + 1200, F.y + 100, ph);
      streak(x, yTop, yTop - 2200 * sc, z, 100 * sc, C.etchant, 0.40 * A, 'blend');
    }
  }
}

/** Highest point of anything currently drawn — the camera framing uses it. */
function deviceTop(P){
  let top = EPI_TOP;
  if (P.emH > 0) top = Math.max(top, EPI_TOP + P.emH);
  if (P.cmH > 0) top = Math.max(top, Y_SC_TOP + P.cmH);
  if (P.bmH > 0) top = Math.max(top, Y_BASE_TOP + P.bmH);
  if (P.bcbTop > 0) top = Math.max(top, P.bcbTop, SUBTOP + BCB_CONF);
  const R = P.resist;
  if (R){
    if (R.kind === 'single') top = Math.max(top, (R.y0 || 0) + (R.thk || 0));
    else if (R.kind === 'bi')
      top = Math.max(top, (R.y0||0) + (R.t1||0) + (R.t2||0) + (R.over||0) + (R.lift||0));
  }
  return top;
}

/* ---------------------------------------------------------------------------
 * 9.  Wafer + die (step 1)
 *
 * The one shape in this whole flow that is not an axis-aligned rectangle:
 * the 3" disc with its two flats.  A circle cut by two half-planes is still
 * convex, so a plain fan triangulation is enough — this file carries none of
 * the formal flow's ear-clipping triangulator, which exists only to join a
 * hole to its outer boundary for non-convex shapes, and nothing here needs
 * that.  The die socket is cut into four convex strips (top, bottom, left,
 * right of the square) instead of one polygon with a hole; their shared
 * edges can seam very faintly while the plate fades, which the formal
 * flow's keyhole() avoids, but is an acceptable trade for not carrying that
 * machinery just for this one shape.
 * ------------------------------------------------------------------------ */
/** Sutherland–Hodgman against one half-plane; keeps everything with fn <= 0. */
function clipPoly(poly, fn){
  const out = [];
  for (let i=0;i<poly.length;i++){
    const a = poly[i], b = poly[(i+1)%poly.length];
    const da = fn(a), db = fn(b);
    if (da <= 0) out.push(a);
    if ((da < 0) !== (db < 0)){
      const t = da/(da-db);
      out.push([lerp(a[0],b[0],t), lerp(a[1],b[1],t)]);
    }
  }
  return out;
}

/** Extrude a CONVEX x/z polygon into a slab from y0 to y1, fanned from
 *  vertex 0 — valid because every polygon this file ever builds is convex. */
function prismConvex(poly, y0, y1, col, o){
  o = o || {};
  const a = o.a === undefined ? 1 : o.a;
  if (poly.length < 3) return;
  const c = typeof col === 'string' ? hex(col) : col;
  begin(o.mode || (a < 1 ? 'blend' : 'opaque'));
  for (let i=1;i<poly.length-1;i++){
    tri([poly[0][0],y1,poly[0][1]], [poly[i][0],y1,poly[i][1]],
        [poly[i+1][0],y1,poly[i+1][1]], c, a);
    tri([poly[0][0],y0,poly[0][1]], [poly[i+1][0],y0,poly[i+1][1]],
        [poly[i][0],y0,poly[i][1]], c, a);
  }
  for (let i=0;i<poly.length;i++){
    const j = (i+1)%poly.length;
    quad([poly[i][0],y0,poly[i][1]], [poly[j][0],y0,poly[j][1]],
         [poly[j][0],y1,poly[j][1]], [poly[i][0],y1,poly[i][1]], c, a);
  }
  end();
  if (o.edges){
    const ec = o.edgeCol ? hex(o.edgeCol) : EDGE, ea = o.edgeA===undefined?EDGE_A:o.edgeA;
    for (let i=0;i<poly.length;i++){
      const j = (i+1)%poly.length;
      line([poly[i][0],y0,poly[i][1]],[poly[j][0],y0,poly[j][1]], ec, ea);
      line([poly[i][0],y1,poly[i][1]],[poly[j][0],y1,poly[j][1]], ec, ea);
      line([poly[i][0],y0,poly[i][1]],[poly[i][0],y1,poly[i][1]], ec, ea);
    }
  }
}

let WAFER_POLY = null, WAFER_SOCKET = null;
function waferPoly(){
  if (WAFER_POLY) return WAFER_POLY;
  let p = [];
  for (let i=0;i<192;i++){
    const a = i/192*Math.PI*2;
    p.push([WR*Math.sin(a), WR*Math.cos(a)]);
  }
  p = clipPoly(p, q => q[1] - WPRI);           // primary flat, toward the viewer
  p = clipPoly(p, q => q[0] - WSEC);           // secondary flat, +90° to the right
  WAFER_POLY = p;
  return p;
}

/** The wafer minus the die socket, as four convex strips — top, bottom,
 *  left and right of the DIE x DIE square — rather than one polygon cut by
 *  a hole (see the section comment for why). */
function waferSocket(){
  if (WAFER_SOCKET) return WAFER_SOCKET;
  const half = DIE/2, P = waferPoly();
  const mid = clipPoly(clipPoly(P, q => q[1]-half), q => -half-q[1]);
  WAFER_SOCKET = [
    clipPoly(P, q => half - q[1]),       // z >= half
    clipPoly(P, q => q[1] + half),       // z <= -half
    clipPoly(mid, q => q[0] + half),     // x <= -half
    clipPoly(mid, q => half - q[0]),     // x >= half
  ].filter(p => p.length >= 3);
  return WAFER_SOCKET;
}

function drawWafer(alpha, gridA, dieLift, cutDie){
  if (alpha <= 0.01) return;
  const o = {a:alpha, edges:true, edgeA:0.5*alpha};
  if (cutDie){
    for (const piece of waferSocket()) prismConvex(piece, -WTH, 0, C.wafer, o);
  } else {
    prismConvex(waferPoly(), -WTH, 0, C.wafer, o);
  }
  if (gridA > 0.01){
    const c = hex(C.scribe), n = Math.ceil(WR/DIE) + 1;
    for (let i=-n;i<=n+1;i++){
      const v = (i-0.5)*DIE;
      if (Math.abs(v) > WR) continue;
      const h = Math.sqrt(Math.max(0, WR*WR - v*v));
      line([v,WGRID,-h],[v,WGRID,Math.min(h,WPRI)], c, 0.7*gridA);
      line([Math.max(-h,-WR),WGRID,v],[Math.min(h,WSEC),WGRID,v], c, 0.7*gridA);
    }
  }
  if (cutDie){
    const y = dieLift;
    box({x0:-DIE/2,x1:DIE/2,z0:-DIE/2,z1:DIE/2}, y-WTH, y, C.wafer,
        {a:alpha, edges:true, edgeA:0.85*alpha, edgeCol:C.metal});
  }
}
